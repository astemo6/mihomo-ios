########################################
# 应用名称： AppClean (synthetic test sample for the B4 conformance corpus)
# 使用说明： QuantumultX [rewrite_local] 样例，与 UnitTests/ScriptEngineConformance.json
#           中的 qx-* 用例一一对应（脚本正文即用例的 code 字段）。
########################################

hostname = api.example.com

# 响应 body：正则剥离信息流里的广告对象（用例 qx-body-regex-strip）
^https?:\/\/api\.example\.com\/v1\/feed url script-response-body https://example.com/scripts/appclean/feed.js

# 请求 body：改写表单里的 token（用例 qx-request-form-body）
^https?:\/\/api\.example\.com\/v1\/login url script-request-body https://example.com/scripts/appclean/login.js

# 二进制 body：protobuf 字段过滤（用例 qx-protobuf-field-drop / qx-request-binary-patch）
^https?:\/\/api\.example\.com\/v1\/browse url script-response-body https://example.com/scripts/appclean/browse.js
^https?:\/\/api\.example\.com\/v1\/collect url script-request-body https://example.com/scripts/appclean/collect.js

# 纯重写（无脚本）：广告统计端点直接 reject
^https?:\/\/api\.example\.com\/v1\/ads\/track url reject-200
