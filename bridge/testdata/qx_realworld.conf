; Quantumult X config fixture (public snippets only: ddgksf2013, blackmatrix7, Orz-3, chavyleung style lines)
[general]
network_check_url=http://www.baidu.com/
server_check_url=http://www.gstatic.com/generate_204
resource_parser_url=https://fastly.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js

[dns]
no-ipv6
server=223.5.5.5
server=119.29.29.29

[policy]
static=节点选择, 香港节点, 日本节点, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
static=YouTube, 节点选择, 香港节点, direct
url-latency-benchmark=香港节点, server-tag-regex=港|HK, check-interval=600, tolerance=50
url-latency-benchmark=日本节点, server-tag-regex=日本|JP, check-interval=600, tolerance=50

[server_remote]
https://sub.example.com/api/v1/client/subscribe?token=abc&flag=quanx, tag=机场A, update-interval=86400, opt-parser=true, enabled=true

[filter_remote]
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/YouTube/YouTube.list, tag=YouTube, force-policy=YouTube, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Privacy/Privacy.list, tag=Privacy, force-policy=reject, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Filter/master/Unbreak.list, tag=Unbreak, force-policy=direct, update-interval=172800, opt-parser=false, enabled=true

[rewrite_remote]
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/StartUp.conf, tag=开屏去广告, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/YoutubeAds.conf, tag=YouTube去广告, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/Orz-3/QuantumultX/master/JD_TB_price.conf, tag=比价, update-interval=172800, opt-parser=false, enabled=false
https://raw.githubusercontent.com/chavyleung/scripts/master/box/rewrite/boxjs.rewrite.quanx.conf, update-interval=86400, opt-parser=false, enabled=true

[server_local]

[filter_local]
host-suffix, local, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 192.168.0.0/16, direct
geoip, cn, direct
final, 节点选择

[rewrite_local]
# 去广告（reject 系列）
^https?:\/\/api\.example\.com\/ad\/splash url reject
^https?:\/\/img\.example\.com\/ad\/.+\.(jpg|png) url reject-img
^https?:\/\/api\.example\.com\/v1\/ad\/config url reject-200
^https?:\/\/api\.example\.com\/v2\/ads url reject-dict
^https?:\/\/api\.example\.com\/v3\/ads url reject-array
;注释行
^https?:\/\/(www\.)?g\.cn url 302 https://www.google.com
^https?:\/\/(www\.)?google\.cn url  307  https://www.google.com
^https?:\/\/api\.example\.com\/feed url request-header (\r\n)User-Agent:.+(\r\n) request-header $1User-Agent: Mozilla/5.0$2
^https?:\/\/api\.example\.com\/x url response-header (\r\n)Cache-Control:.+(\r\n) response-header $1Cache-Control: no-cache$2
^https?:\/\/api\.example\.com\/body url request-body "ads":true request-body "ads":false
^https?:\/\/api\.example\.com\/resp url response-body "vip":false response-body "vip":true
^https?:\/\/api\.example\.com\/cookie url script-request-header https://raw.githubusercontent.com/chavyleung/scripts/master/example/cookie.js
^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting) url script-response-body https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js
^https?:\/\/api\.example\.com\/echo url script-echo-response https://raw.githubusercontent.com/example/scripts/master/echo.js
^https?:\/\/api\.example\.com\/analyze url script-analyze-echo-response https://raw.githubusercontent.com/example/scripts/master/analyze.js
^https?:\/\/api\.example\.com\/hdr url script-response-header https://raw.githubusercontent.com/example/scripts/master/hdr.js
^https?:\/\/api\.example\.com\/reqbody url script-request-body https://raw.githubusercontent.com/example/scripts/master/reqbody.js
^https?:\/\/api\.example\.com\/local url echo-response text/json echo-response https://raw.githubusercontent.com/example/data/master/empty.json
^https?:\/\/api\.example\.com\/and url-and-header reject
http-response ^https?:\/\/api\.example\.com\/surge script-path=https://raw.githubusercontent.com/example/scripts/master/surge.js, requires-body=true, tag=SurgeStyle

[task_local]
0 9 * * * https://raw.githubusercontent.com/chavyleung/scripts/master/10000/10000.js, tag=电信签到, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/10000.png, enabled=true
30 8 * * * https://raw.githubusercontent.com/chavyleung/scripts/master/bilibili/bilibili.js, tag=B站签到, enabled=false

[http_backend]

[mitm]
hostname = api.example.com, img.example.com, *.googlevideo.com, youtubei.googleapis.com, -i.example.com, www.g.cn, g.cn, google.cn, boxjs.com
passphrase = XXXX
p12 = XXXX
