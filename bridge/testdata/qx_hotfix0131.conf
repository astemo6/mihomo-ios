#!Subscribe link: https://example.com/raw/quanx.conf

# synthetic fixture for the v0.13.1 import hotfix (same traits as a real-world QX export)
; 
[general]
server_check_url=http://www.gstatic.com/generate_204
excluded_routes=192.168.0.0/16, 10.0.0.0/8

[dns]
server=223.5.5.5
server=/*testflight.apple.com/8.8.8.8
server=/*.example.org/119.29.29.29
address=/*router.example.lan/192.168.1.1

[policy]
static=节点选择, 东京 IPv6, 东京 v4, proxy, direct, img-url=https://example.com/icon.png
static=回国, direct, proxy

[server_local] 
vmess=2001:db8:57::8e:889f:443, method=aes-128-gcm, password=00000000-0000-0000-0000-000000000000, obfs=wss, obfs-uri=/ws, obfs-host=cdn.example.com, tls-verification=false, fast-open=false, udp-relay=false, aead=true, tag=东京 IPv6
shadowsocks=203.0.113.10:8388, method=aes-128-gcm, password=secret, fast-open=false, udp-relay=true, tag=东京 v4

[server_remote]
https://example.com/sub?token=x, tag=sub, update-interval=172800, opt-parser=true, enabled=false

[filter_remote]
https://example.com/rules/apple.list, tag=Apple, force-policy=direct, update-interval=86400, opt-parser=false, enabled=true

[rewrite_remote]
https://example.com/rewrite/ad.snippet, tag=AD, update-interval=86400, opt-parser=false, enabled=true

[task_local]
0 9 * * * https://example.com/task.js, tag=签到, enabled=true

[filter_local]
host-suffix, example.cn, 回国
host-keyword, , 节点选择
ip-cidr, 10.0.0.0/8, direct
geoip, cn, direct
final, 节点选择

[rewrite_local]
^https?://ad\.example\.com url reject

[http_backend]
https://example.com/backend.js, tag=Backend, path=^/api/, enabled=false

[mitm]
hostname = ad.example.com
