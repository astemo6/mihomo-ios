# OpenConnect VPN Server (ocserv) loopback configuration template
# Used by tools/loopback/start-servers.sh for UnitTests/NativeCoreLoopbackTests.swift
# Port 18011 (TCP + UDP)

auth = "plain[passwd=__LOOPBACK_DIR__/ocpasswd]"
tcp-port = 18011
udp-port = 18011
server-cert = __LOOPBACK_DIR__/cert.pem
server-key = __LOOPBACK_DIR__/key.pem
socket-file = __LOOPBACK_DIR__/ocserv.sock
pid-file = __LOOPBACK_DIR__/ocserv.pid
isolate-workers = false
max-clients = 16
max-same-clients = 4
keepalive = 300
dpd = 30
try-mtu-discovery = false
cert-user-oid = 0.9.2342.19200300.100.1.1
tls-priorities = "NORMAL:%SERVER_PRECEDENCE:%COMPAT"
auth-timeout = 240
cookie-timeout = 300
rekey-time = 172800
rekey-method = ssl
device = vpns
predictable-ips = true
default-domain = example.com
ipv4-network = 192.168.109.0
ipv4-netmask = 255.255.255.0
cisco-client-compat = true
dtls-legacy = true
