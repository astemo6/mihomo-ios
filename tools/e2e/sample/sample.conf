# Tern E2E replay — sanitized sample fixture (Quantumult X export shape).
# Every server is on 127.0.0.1 (tools/e2e/start-e2e.sh); every remote resource is served by
# tools/e2e/e2e_server.py on 127.0.0.1:18480. Domains *.localtest.me resolve to 127.0.0.1 in public DNS.
# Loopback-only test credentials — never reuse them anywhere.

[general]
server_check_url = http://127.0.0.1:18480/generate_204
server_check_timeout = 3000
network_check_url = http://127.0.0.1:18480/generate_204

[dns]
server = 223.5.5.5
server = 8.8.8.8

[policy]
static = Proxy, E2E-VMess-WS, E2E-SS, Auto, SubGroup, direct
url-latency-benchmark = Auto, E2E-SS, E2E-VMess-WS, E2E-Dead, check-interval=600, tolerance=50
static = SubGroup, resource-tag-regex=E2E-Sub

[server_remote]
http://127.0.0.1:18480/sub/nodes.txt, tag=E2E-Sub, update-interval=86400, opt-parser=false, enabled=true

[filter_remote]
http://127.0.0.1:18480/rules/e2e-reject.list, tag=E2E-Reject, force-policy=reject, update-interval=86400, opt-parser=false, enabled=true
http://127.0.0.1:18480/rules/e2e-direct.list, tag=E2E-Direct, force-policy=direct, update-interval=86400, opt-parser=false, enabled=true

[rewrite_remote]
http://127.0.0.1:18480/modules/e2e-remote.snippet, tag=E2E-Remote, update-interval=86400, opt-parser=false, enabled=true

[server_local]
vmess = 127.0.0.1:18103, method=chacha20-poly1305, password=7d2b0c1e-5c3a-4f7e-9a7b-3c1d2e4f5a6b, obfs=ws, obfs-host=127.0.0.1, obfs-uri=/e2e-ws, fast-open=false, udp-relay=false, tag=E2E-VMess-WS
shadowsocks = 127.0.0.1:18101, method=aes-256-gcm, password=e2e-ss-pw, fast-open=false, udp-relay=false, tag=E2E-SS
shadowsocks = 127.0.0.1:18199, method=aes-256-gcm, password=e2e-dead-pw, fast-open=false, udp-relay=false, tag=E2E-Dead

[filter_local]
host, e2e-proxy.localtest.me, Proxy
host, e2e-direct.localtest.me, direct
host, e2e-redir.localtest.me, direct
host, e2e-fake.localtest.me, direct
host, e2e-sub.localtest.me, SubGroup
host-suffix, e2e-mitm.localtest.me, direct
ip-cidr, 10.0.0.0/8, direct, no-resolve
geoip, cn, direct
final, Proxy

[rewrite_local]
^https?:\/\/e2e-mitm\.localtest\.me\/reject url reject-200
^https?:\/\/e2e-mitm\.localtest\.me\/echo url script-echo-response http://127.0.0.1:18480/scripts/e2e-echo.js
^https?:\/\/httpbin\.org\/get url script-response-body http://127.0.0.1:18480/scripts/e2e-resp.js

[task_local]
0 9 * * * http://127.0.0.1:18480/scripts/e2e-task.js, tag=E2E-Task, enabled=true
*/30 * * * * http://127.0.0.1:18480/scripts/e2e-task.js, tag=E2E-Task-30, enabled=true

[mitm]
hostname = e2e-mitm.localtest.me, httpbin.org
skip_validating_cert = true
