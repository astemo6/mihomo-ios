# =====================================================================
#  Tern 示例配置 · Sample profile (Clash / Clash Meta YAML)
# =====================================================================
#  这是一份「读着学」的完整示例，作用类似 Quantumult X 的示例配置：
#  每一段都写了注释，说明内核怎么理解它、本 App 在 iOS 上会怎么处理它。
#  Every section is commented; English hints are in parentheses.
#
#  · 所有服务器、密码、密钥、订阅链接都是占位符（example.com / xxxx / 全 0 密钥），
#    没有任何可用节点。请换成你自己的内容后再使用。
#    (All hosts / keys are placeholders. Replace them with your own.)
#  · 「以此新建配置」会把这份文件复制成一个新的本地配置，之后可以在 配置 → 左滑 → 编辑 修改。
#  · 以 # 开头的行是注释，内核会忽略。很多示例默认是注释状态，去掉行首的 # 即可启用。
#  · 本 App 会在连接时覆盖一部分设置（下面每段都会写明），以 App 内的开关为准。
# =====================================================================


# ---------------------------------------------------------------------
# 1. 通用 (General)
# ---------------------------------------------------------------------

# 出站模式 (mode)：rule = 按规则分流（推荐），global = 全部走「GLOBAL」组，direct = 全部直连。
# 本 App：首页 / 策略页的「规则 / 全局 / 直连」开关会覆盖这里。
mode: rule

# 日志级别 (log level)：silent / error / warning / info / debug。
# 本 App：更多 → 内核设置 → 日志级别 会覆盖这里；debug 会明显增加耗电和内存。
log-level: info

# IPv6：本 App 由 更多 → 连接方式 → IPv6（自动 / 开 / 关）决定，这里的值会被覆盖。
ipv6: false

# 局域网共享 (allow-lan)：由 更多 → 局域网共享 决定。打开后 App 会监听 mixed-port 给同一 Wi-Fi 下的设备用。
allow-lan: false
# 端口 (ports)：iOS 上只有 tun（数据包隧道）一个入口，port / socks-port / mixed-port 等会被删除；
# 局域网共享打开时由 App 自己分配 mixed-port。下面这行只是示意。
# mixed-port: 7890

# 外部控制 (external-controller / secret)：App 固定使用 127.0.0.1 + 随机密钥（更多 → 内核设置），这里的值无效。
# external-controller: 127.0.0.1:9090
# secret: "xxxx"

# 延迟测试 URL 的统一延迟（unified-delay）App 总是打开；TCP 保活默认 30 / 300 秒以省电。
# keep-alive-interval: 30
# keep-alive-idle: 300

# 进程匹配 (find-process-mode)：iOS 的网络扩展拿不到发起连接的 App，App 会强制设为 off，
# 所以 PROCESS-NAME / PROCESS-PATH 规则在 iOS 上永远不会命中。
# find-process-mode: off

# 记住策略组选择 (profile.store-selected)：App 总是打开，切换配置 / 重连后保留你的选择。
profile:
  store-selected: true

# GeoIP / GeoSite 数据：App 内置 geoip.metadb 和 GeoSite.dat，并以 memconservative 方式加载；
# 下载地址可在 更多 → 资源 里换镜像。geox-url 会被 App 改成所选镜像。
# geox-url:
#   geoip: "https://example.com/geoip.metadb"
#   geosite: "https://example.com/geosite.dat"


# ---------------------------------------------------------------------
# 2. TUN（数据包隧道）
# ---------------------------------------------------------------------
# iOS 上 tun 由系统的 NEPacketTunnelProvider 提供，App 在连接时自动生成整段 tun 设置
# （gVisor 协议栈、DNS 劫持 any:53、MTU 取自 更多 → 内核设置）。这里写的 tun 会被替换，
# 所以只作说明，不需要填写。
# tun:
#   enable: true
#   stack: gvisor          # App 固定 gvisor
#   mtu: 1500              # 更多 → 内核设置 → MTU
#   dns-hijack: [any:53]
#   auto-route: false      # 路由由 iOS 管理；包含 / 排除的网段在 更多 → 连接方式 设置


# ---------------------------------------------------------------------
# 3. DNS
# ---------------------------------------------------------------------
# App 总会启用 DNS；enhanced-mode 由 更多 → DNS → 模式 决定（fake-ip 推荐）。
# 更多 → DNS 里的服务器、分流设置会叠加到这里；没写 nameserver 时 App 使用阿里 / 腾讯 DoH。
dns:
  enable: true
  enhanced-mode: fake-ip           # fake-ip（推荐，最快）/ redir-host
  fake-ip-range: 198.18.0.1/16     # App 的 tun 地址也从这个网段推出，请不要改成别的网段
  # fake-ip-filter：这些域名返回真实 IP（局域网、NTP、系统连通性检测等）
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.ntp.org"
    - "+.apple.com"
  # 用来解析下面 DoH / DoT 服务器域名本身的 DNS，必须是 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 默认上游 (nameserver)。格式示例：
  #   DoH  https://host/dns-query      DoT  tls://host:853
  #   DoQ  quic://host:853             UDP  223.5.5.5   系统 DNS  system
  nameserver:
    - https://223.5.5.5/dns-query        # AliDNS DoH
    - https://doh.pub/dns-query          # DNSPod DoH
    # - tls://dot.pub:853                # DNSPod DoT
    # - quic://dns.alidns.com:853        # AliDNS DoQ
  # 解析代理服务器域名用的 DNS（避免被污染的结果让节点连不上）
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  # 按域名指定上游 (nameserver-policy)：键可以是域名、+.通配、geosite:、rule-set:
  nameserver-policy:
    "geosite:cn,private": [https://223.5.5.5/dns-query]
    "+.example.com": [tls://1.1.1.1:853]
    # "geosite:geolocation-!cn": [https://1.1.1.1/dns-query, https://dns.google/dns-query]
    # "rule-set:my-direct": [223.5.5.5]
  # 国外上游示例（Cloudflare / Google / Quad9），常和 nameserver-policy 搭配：
  # fallback:
  #   - https://1.1.1.1/dns-query
  #   - https://dns.google/dns-query
  #   - tls://9.9.9.9:853


# ---------------------------------------------------------------------
# 4. 嗅探 (sniffer)
# ---------------------------------------------------------------------
# 开关在 更多 → 内核设置 → 域名嗅探；打开时没有写 sniff 的话 App 会补上 HTTP / TLS / QUIC。
# sniffer:
#   enable: true
#   sniff:
#     TLS: {ports: [443, 8443]}
#     HTTP: {ports: [80, 8080-8880], override-destination: true}
#     QUIC: {ports: [443, 8443]}


# ---------------------------------------------------------------------
# 5. 节点 (proxies)
# ---------------------------------------------------------------------
# 每种协议一个例子。服务器都是 example.com，密钥是占位符，连不上是正常的。
# 也可以不写在这里：配置 → 手动节点 / 更多 → 节点管理 → 添加节点，用表单或粘贴分享链接添加。
# 通用可选项（多数协议都支持）：udp、ip-version、dialer-proxy（前置代理 / 代理链）、tfo、mptcp。
proxies:
  # --- Shadowsocks（AEAD / 2022）---
  - name: "🇭🇰 HK SS 示例"
    type: ss
    server: hk.example.com
    port: 8388
    cipher: 2022-blake3-aes-128-gcm      # 也可 aes-128-gcm / chacha20-ietf-poly1305 …
    password: "AAAAAAAAAAAAAAAAAAAAAA=="  # 2022 系列需要 Base64 密钥，替换为你的
    udp: true

  # --- Shadowsocks + ShadowTLS v3 ---
  - name: "🇭🇰 HK ShadowTLS 示例"
    type: ss
    server: hk.example.com
    port: 443
    cipher: 2022-blake3-aes-128-gcm
    password: "AAAAAAAAAAAAAAAAAAAAAA=="
    plugin: shadow-tls
    plugin-opts:
      host: www.example.com
      password: "xxxx"
      version: 3

  # --- VMess + WebSocket + TLS ---
  - name: "🇯🇵 JP VMess 示例"
    type: vmess
    server: jp.example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    alterId: 0
    cipher: auto
    tls: true
    servername: jp.example.com
    network: ws
    ws-opts:
      path: /ws
      headers:
        Host: jp.example.com
    udp: true

  # --- VLESS + Reality + XTLS-Vision ---
  - name: "🇺🇸 US VLESS Reality 示例"
    type: vless
    server: us.example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    flow: xtls-rprx-vision
    tls: true
    servername: www.example.com               # Reality 伪装站点
    client-fingerprint: chrome
    reality-opts:
      public-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA   # 服务端公钥，替换为你的
      short-id: "0123abcd"
    udp: true

  # --- VLESS + XHTTP（Xray 新传输）---
  - name: "🇺🇸 US VLESS XHTTP 示例"
    type: vless
    server: us.example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    tls: true
    servername: us.example.com
    client-fingerprint: chrome
    network: xhttp
    xhttp-opts:
      path: /xhttp
      mode: auto

  # --- Trojan ---
  - name: "🇸🇬 SG Trojan 示例"
    type: trojan
    server: sg.example.com
    port: 443
    password: "xxxx"
    sni: sg.example.com
    udp: true

  # --- Hysteria2（端口跳跃 port hopping）---
  - name: "🇸🇬 SG Hysteria2 示例"
    type: hysteria2
    server: sg.example.com
    port: 443
    ports: 20000-30000          # 端口跳跃范围
    hop-interval: 30            # 每 30 秒换一个端口
    password: "xxxx"
    sni: sg.example.com
    obfs: salamander            # 可选混淆
    obfs-password: "xxxx"
    up: "50 Mbps"
    down: "200 Mbps"

  # --- TUIC v5 ---
  - name: "🇹🇼 TW TUIC 示例"
    type: tuic
    server: tw.example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    password: "xxxx"
    sni: tw.example.com
    alpn: [h3]
    congestion-controller: bbr
    udp-relay-mode: native

  # --- WireGuard（也可加 amnezia-wg-option 变成 AmneziaWG）---
  - name: "🇩🇪 DE WireGuard 示例"
    type: wireguard
    server: de.example.com
    port: 51820
    ip: 172.16.0.2
    private-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=    # 你的私钥
    public-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=     # 对端公钥
    mtu: 1408
    udp: true
    # amnezia-wg-option: {jc: 4, jmin: 40, jmax: 70, s1: 0, s2: 0, h1: 1, h2: 2, h3: 3, h4: 4}

  # --- AnyTLS ---
  - name: "🇯🇵 JP AnyTLS 示例"
    type: anytls
    server: jp.example.com
    port: 443
    password: "xxxx"
    sni: jp.example.com
    udp: true

  # --- Snell v4 ---
  - name: "🇯🇵 JP Snell 示例"
    type: snell
    server: jp.example.com
    port: 6160
    psk: "xxxx"
    version: 4
    udp: true

  # --- Mieru ---
  - name: "🇯🇵 JP Mieru 示例"
    type: mieru
    server: jp.example.com
    port: 2999
    transport: TCP
    username: "xxxx"
    password: "xxxx"

  # --- SSH ---
  - name: "🏠 SSH 示例"
    type: ssh
    server: ssh.example.com
    port: 22
    username: "xxxx"
    password: "xxxx"
    # private-key: "-----BEGIN OPENSSH PRIVATE KEY----- …"   # 也可用私钥

  # --- SOCKS5 / HTTP(S) ---
  - name: "🏠 SOCKS5 示例"
    type: socks5
    server: proxy.example.com
    port: 1080
    username: "xxxx"
    password: "xxxx"
    udp: true
  - name: "🏠 HTTPS 示例"
    type: http
    server: proxy.example.com
    port: 443
    tls: true
    username: "xxxx"
    password: "xxxx"

  # ===== 较新的协议 (newer protocols) =====

  # --- Sudoku（数独编码伪装，可加 HTTP 伪装）---
  - name: "🆕 Sudoku 示例"
    type: sudoku
    server: new.example.com
    port: 443
    key: "xxxx"
    aead-method: chacha20-poly1305
    table-type: prefer_ascii

  # --- TrustTunnel（AdGuard，HTTP/2 · HTTP/3）---
  - name: "🆕 TrustTunnel 示例"
    type: trusttunnel
    server: new.example.com
    port: 443
    username: "xxxx"
    password: "xxxx"
    sni: new.example.com
    alpn: [h2]
    udp: true

  # --- ShadowQUIC（伪装成普通 QUIC）---
  - name: "🆕 ShadowQUIC 示例"
    type: shadowquic
    server: new.example.com
    port: 443
    username: "xxxx"
    password: "xxxx"
    sni: www.example.com
    alpn: [h3]
    congestion-controller: bbr

  # --- GOST Relay（GOST v3）---
  - name: "🆕 GOST Relay 示例"
    type: gost-relay
    server: new.example.com
    port: 8443
    username: "xxxx"
    password: "xxxx"
    tls: true
    sni: new.example.com
    udp: true

  # --- MASQUE（HTTP/3 隧道，如 WARP 的 MASQUE 模式）：需要服务端下发的密钥，默认注释 ---
  # - name: "🆕 MASQUE 示例"
  #   type: masque
  #   server: masque.example.com
  #   port: 443
  #   private-key: "xxxx"
  #   public-key: "xxxx"
  #   ip: 172.16.0.2
  #   mtu: 1280
  #   udp: true

  # --- OpenVPN（内核在用户态连接，不创建系统 VPN）：需要 CA 证书，默认注释 ---
  # - name: "🆕 OpenVPN 示例"
  #   type: openvpn
  #   server: vpn.example.com
  #   port: 1194
  #   proto: udp
  #   username: "xxxx"
  #   password: "xxxx"
  #   ca: |
  #     -----BEGIN CERTIFICATE-----
  #     xxxx
  #     -----END CERTIFICATE-----

  # --- Tailscale（实验性 / experimental）---
  # 在隧道扩展里加入你的 tailnet。iOS 只给 VPN 扩展约 50 MB 内存，Tailscale 会额外占用不少：
  # 剩余内存不足 14 MB 时 App 会拒绝启动它，运行中不足 5 MB 会自动停止。
  # 实际占用在 更多 → 诊断 → 隧道内存 查看。没有 server / port；状态保存在 App Group 内。
  # 目标不在 tailnet 路由内时连接会失败，访问公网需要 exit-node。默认注释。
  # - name: "🧪 Tailscale 示例"
  #   type: tailscale
  #   auth-key: tskey-auth-xxxx          # 在 Tailscale 后台生成；不填时登录链接显示在 诊断 页
  #   hostname: mihomo-ios
  #   # control-url: https://headscale.example.com   # 自建 Headscale
  #   # state-dir: tailscale/my-node                  # 留空 = tailscale/<节点名>，始终在 App Group 内
  #   ephemeral: false
  #   udp: true
  #   accept-routes: true
  #   # exit-node: 100.64.0.1            # 或 auto:any
  #   # exit-node-allow-lan-access: true

  # --- 代理链示例：先经过「🇭🇰 HK SS 示例」再连这个节点 (dialer-proxy) ---
  - name: "🔗 链式示例"
    type: trojan
    server: chain.example.com
    port: 443
    password: "xxxx"
    sni: chain.example.com
    dialer-proxy: "🇭🇰 HK SS 示例"


# ---------------------------------------------------------------------
# 6. 订阅 / 节点集 (proxy-providers)
# ---------------------------------------------------------------------
# 机场订阅链接写在这里（或用 配置 → 订阅管理 添加节点订阅，App 会自动合并进来）。
# filter / exclude-filter 用正则筛节点，override 统一改写节点参数。
proxy-providers:
  机场A:
    type: http
    url: "https://sub.example.com/api/v1/client/subscribe?token=xxxx"   # 你的订阅链接
    interval: 86400                  # 每天更新一次（秒）
    path: ./providers/airport-a.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
    filter: "(?i)港|HK|日本|JP|新加坡|SG|美国|US"      # 只要这些地区
    exclude-filter: "(?i)过期|剩余|官网|到期|expire"     # 去掉信息节点
    override:
      udp: true
      skip-cert-verify: false
      # dialer-proxy: "🇭🇰 HK SS 示例"
  # 也可以把节点直接写在 provider 里 (inline)：
  本地节点集:
    type: inline
    payload:
      - name: "🇰🇷 KR Inline 示例"
        type: ss
        server: kr.example.com
        port: 8388
        cipher: aes-128-gcm
        password: "xxxx"


# ---------------------------------------------------------------------
# 7. 策略组 (proxy-groups)
# ---------------------------------------------------------------------
# select = 手动选；url-test = 自动选最快；fallback = 按顺序用第一个可用的；load-balance = 负载均衡。
# include-all: true 会把所有节点（proxies + 订阅）加进来，再用 filter / exclude-filter 过滤。
# 在 App 里也可以直接改：策略 → 长按策略组 → 编辑；首页卡片在 首页 → 编辑首页策略。
proxy-groups:
  - name: 节点选择
    type: select
    icon: https://example.com/icons/proxy.png      # 可选图标
    proxies: [自动选择, 故障转移, 负载均衡, 🇭🇰 香港, 🇯🇵 日本, 🇺🇸 美国, 🇸🇬 狮城, DIRECT]
    use: [机场A, 本地节点集]

  - name: 自动选择
    type: url-test
    include-all: true
    exclude-filter: "(?i)示例链式|🔗"
    url: https://www.gstatic.com/generate_204
    interval: 300            # 秒
    tolerance: 50            # 新节点快 50 ms 以上才切换
    lazy: true

  - name: 故障转移
    type: fallback
    proxies: ["🇭🇰 HK SS 示例", "🇯🇵 JP VMess 示例", "🇸🇬 SG Trojan 示例"]
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: 负载均衡
    type: load-balance
    strategy: consistent-hashing     # 或 round-robin / sticky-sessions
    proxies: ["🇺🇸 US VLESS Reality 示例", "🇺🇸 US VLESS XHTTP 示例"]
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 地区组：从全部节点（含订阅）里按名字筛选
  - name: 🇭🇰 香港
    type: url-test
    include-all: true
    filter: "(?i)港|HK|Hong ?Kong"
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: 🇯🇵 日本
    type: url-test
    include-all: true
    filter: "(?i)日本|JP|Japan|东京|大阪"
    exclude-filter: "(?i)Snell"
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: 🇺🇸 美国
    type: url-test
    include-all: true
    filter: "(?i)美国|US|United States|洛杉矶|圣何塞"
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: 🇸🇬 狮城
    type: fallback
    include-all-proxies: true          # 只要本文件 proxies 里的，不要订阅
    filter: "(?i)新加坡|狮城|SG|Singapore"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 按用途分流的组
  - name: 流媒体
    type: select
    proxies: [节点选择, 🇭🇰 香港, 🇯🇵 日本, 🇺🇸 美国, 🇸🇬 狮城]
  - name: Apple
    type: select
    proxies: [DIRECT, 节点选择]
  - name: 广告拦截
    type: select
    proxies: [REJECT, DIRECT]
  - name: 漏网之鱼
    type: select
    proxies: [节点选择, DIRECT]


# ---------------------------------------------------------------------
# 8. 规则集 (rule-providers)
# ---------------------------------------------------------------------
# behavior：domain（域名列表）/ ipcidr（IP 段）/ classical（任意规则写法）。
# format：yaml / text / mrs（二进制规则集格式，最省内存，只支持 domain 和 ipcidr）。
# 下面的 URL 是 MetaCubeX 公开的规则集（只是规则列表，不含节点）。
rule-providers:
  ads:
    type: http
    behavior: domain
    format: mrs
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.mrs"
    path: ./ruleset/ads.mrs
    interval: 86400
  telegram-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.mrs"
    path: ./ruleset/telegram-ip.mrs
    interval: 86400
  my-direct:
    type: http
    behavior: classical
    format: text
    url: "https://example.com/rules/my-direct.list"     # 你自己的规则列表（每行一条 DOMAIN-SUFFIX,xxx 之类）
    path: ./ruleset/my-direct.list
    interval: 86400
  # 规则也可以内联 (inline)：
  my-inline:
    type: inline
    behavior: classical
    payload:
      - DOMAIN-SUFFIX,internal.example.com
      - IP-CIDR,10.0.0.0/8


# ---------------------------------------------------------------------
# 9. 规则 (rules) —— 从上到下匹配，命中第一条即停止
# ---------------------------------------------------------------------
# 格式：类型,内容,策略[,附加参数]。策略可以是节点、策略组、DIRECT、REJECT、REJECT-DROP。
# App 的 更多 → 自定义规则 会插在这些规则前面；规则页能看到每条的命中次数。
rules:
  # 规则集
  - RULE-SET,ads,广告拦截
  - RULE-SET,my-inline,DIRECT
  - RULE-SET,my-direct,DIRECT
  # 域名类
  - DOMAIN,login.example.com,节点选择              # 完整域名
  - DOMAIN-SUFFIX,example.org,节点选择             # 域名及其子域
  - DOMAIN-KEYWORD,examplekeyword,节点选择          # 包含关键字
  - DOMAIN-WILDCARD,*.cdn.example.net,DIRECT       # 通配符
  - DOMAIN-REGEX,^api\d+\.example\.com$,节点选择    # 正则
  # GeoSite（内置 GeoSite.dat）
  - GEOSITE,apple,Apple
  - GEOSITE,youtube,流媒体
  - GEOSITE,netflix,流媒体
  - GEOSITE,private,DIRECT
  - GEOSITE,cn,DIRECT
  # 逻辑规则 AND / OR / NOT
  - AND,((NETWORK,UDP),(DST-PORT,443),(DOMAIN-SUFFIX,googlevideo.com)),REJECT    # 让 YouTube 回落到 TCP
  - OR,((DOMAIN-SUFFIX,example.tv),(DOMAIN-KEYWORD,examplevideo)),流媒体
  - AND,((DOMAIN-SUFFIX,example.net),(NOT,((DST-PORT,443)))),DIRECT                # NOT 常放在 AND 里：example.net 的非 443 端口直连
  # 单独的 NOT 会匹配「除了…之外的一切」，放在中间会让后面的规则失效：
  # - NOT,((DOMAIN-SUFFIX,example.com)),节点选择
  # 端口 / 网络
  - DST-PORT,22,DIRECT
  # - SRC-PORT,7777,DIRECT
  # - NETWORK,UDP,DIRECT
  # IP 类（加 no-resolve：域名请求不为这条规则去做 DNS 解析，更快）
  - RULE-SET,telegram-ip,节点选择,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - SRC-IP-CIDR,192.168.1.100/32,DIRECT            # 局域网共享时按来源设备分流
  # - IP-ASN,13335,节点选择,no-resolve             # 需要 ASN 数据库，App 会在用到时下载
  # 进程规则：iOS 网络扩展拿不到来源 App，PROCESS-NAME / PROCESS-PATH 在 iOS 上不会命中，仅作说明
  # - PROCESS-NAME,Telegram,节点选择
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  # 兜底（必须放最后）
  - MATCH,漏网之鱼


# =====================================================================
# 10. App 扩展：模块 / 重写 / MitM / 脚本 / 定时任务 / 面板
# =====================================================================
# 这些不是 Clash YAML 的一部分，不能写在本文件里生效；它们由 App 的引擎处理。
# 用法：更多 → 模块与资源 → 添加模块（填 .sgmodule / .plugin / .conf / .stoverride 链接），
#       或 更多 → 本地模块，把下面的文字粘贴进去（Surge 和 Quantumult X 写法都认）。
# MitM 需要先在 更多 → MitM 生成并信任证书；只解密 hostname 里列出的域名。
#
# ---- Surge 模块写法 (.sgmodule) ----
# #!name=示例模块
# #!desc=演示重写、脚本、MitM 与面板
#
# [Rule]
# DOMAIN-SUFFIX,ads.example.com,REJECT
#
# [URL Rewrite]
# ^https?://ad\.example\.com/ - reject
# ^https?://old\.example\.com/(.*) https://new.example.com/$1 302
#
# [Header Rewrite]
# ^https?://api\.example\.com/ header-add X-Demo 1
#
# [Map Local]
# ^https?://api\.example\.com/ad data-type=text data="{}" status-code=200
#
# [Script]
# 示例响应脚本 = type=http-response,pattern=^https?://api\.example\.com/v1/user,requires-body=1,script-path=https://example.com/scripts/demo.js
# 示例定时任务 = type=cron,cronexp="0 9 * * *",script-path=https://example.com/scripts/checkin.js
# 示例面板脚本 = type=generic,script-path=https://example.com/scripts/panel.js
#
# [Panel]
# 示例面板 = script-name=示例面板脚本,update-interval=3600
#
# [MITM]
# hostname = %APPEND% api.example.com, ad.example.com
#
# ---- Quantumult X 写法 (rewrite_local / task_local) ----
# [rewrite_local]
# ^https?://ad\.example\.com/ url reject
# ^https?://old\.example\.com/(.*) url 302 https://new.example.com/$1
# ^https?://api\.example\.com/v1/user url script-response-body https://example.com/scripts/demo.js
#
# [task_local]
# 0 9 * * * https://example.com/scripts/checkin.js, tag=示例签到, enabled=true
#
# [mitm]
# hostname = api.example.com, ad.example.com
#
# 首页面板：模块里的 [Panel]（Surge）或 Stash tiles 会出现在 首页 和 更多 → 面板，可在 App 里改标题 / 图标 / 刷新间隔。
# =====================================================================
