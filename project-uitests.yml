# test/selftest: the app project plus a simulator UI test target. Used only by .github/workflows/ui-tests.yml
# (`xcodegen generate --spec project-uitests.yml`); the release build keeps using project.yml unchanged.
include:
  - path: project.yml

targets:
  MihomoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
      # The app's String Catalog, so the tests look up the same labels in zh-Hans and en.
      - path: App/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: Mihomo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astemo6.mihomo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mihomo
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_ENTITLEMENTS: ""

  # v0.19.5: Swift unit tests (backup / restore, CoreOverrides decoding, SubscriptionUserInfo, RouteSpec,
  # ProfileStore merge + header names), hosted in the app so `@testable import Mihomo` reaches internal types.
  MihomoUnitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UnitTests
      # feat/nc-e2e: the E2E replay's result sink (stage 1 = UnitTests/NativeCoreE2EReplayTests.swift).
      - path: E2ETests/E2EReport.swift
    dependencies:
      - target: Mihomo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astemo6.mihomo.unittests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mihomo.app/Mihomo"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_ENTITLEMENTS: ""

  # feat/nc-e2e: E2E replay stage 2 — NativeCore in-process. Compiles the PacketTunnel target's sources (same
  # excludes, bridging header, lwIP headers and TERN_TUNNEL as project.yml) next to E2ETests/, hosted in the app so
  # it shares the app container with stage 1. Never imports the Mihomo module (that would make every Shared type
  # ambiguous). Only the TernE2E scheme builds it (.github/workflows/e2e-replay.yml); the MihomoUITests scheme and the
  # release project are unchanged.
  TernE2ETunnelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: E2ETests
      - path: PacketTunnel
        excludes: ["**/*.entitlements", "Info.plist", "NativeMitM/Script/TernPrelude.js"]
      - path: Shared
        excludes: ["LiveActivityShared.swift", "LiveActivityViews.swift", "TunnelControl.swift"]
    dependencies:
      - target: Mihomo
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astemo6.mihomo.e2etests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mihomo.app/Mihomo"
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_ENTITLEMENTS: ""
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/NativeCore/NCBridge.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/PacketTunnel/NativeCore/lwip
          - $(PROJECT_DIR)/PacketTunnel/NativeCore/lwip/include
          - $(PROJECT_DIR)/PacketTunnel/NativeCore/lwip/port
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TERN_TUNNEL

schemes:
  # feat/nc-e2e: e2e-replay.yml only.
  TernE2E:
    build:
      targets:
        Mihomo: all
        MihomoUnitTests: [test]
        TernE2ETunnelTests: [test]
    # fix/nc-mem-4: XcodeGen writes this flag to the TestAction too (disablePerformanceAntipatternChecker). With the
    # checker on, its priority-inversion report (JSCThread) was picked up by XCTest on the main thread, which
    # symbolicated it with CoreSymbolication — parsing the stabs of the ~100 MB Debug test bundle: +55 MB of
    # footprint for ~2 s, the whole kernel peak the memory gate saw (runs 40419441795 / 40422441193 / 40425118192,
    # main-thread backtraces in stage2.log). A device build never runs the checker.
    run:
      config: Debug
      disableThreadPerformanceChecker: true
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: MihomoUnitTests
        - name: TernE2ETunnelTests
  MihomoUITests:
    build:
      targets:
        Mihomo: all
        MihomoUITests: [test]
        MihomoUnitTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: MihomoUnitTests
        - name: MihomoUITests
