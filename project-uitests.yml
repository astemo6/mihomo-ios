# test/selftest: the app project plus a simulator UI test target. Used only by .github/workflows/ui-tests.yml
# (`xcodegen generate --spec project-uitests.yml`); the release build keeps using project.yml unchanged.
include:
  - path: project.yml

targets:
  TernUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
      # The app's String Catalog, so the tests look up the same labels in zh-Hans and en.
      - path: App/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: Tern
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astemo6.mihomo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tern
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_ENTITLEMENTS: ""

  # v0.19.5: Swift unit tests (backup / restore, CoreOverrides decoding, SubscriptionUserInfo, RouteSpec,
  # ProfileStore merge + header names), hosted in the app so `@testable import Tern` reaches internal types.
  TernUnitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UnitTests
      # feat/nc-e2e: the E2E replay's result sink (stage 1 = UnitTests/NativeCoreE2EReplayTests.swift).
      - path: E2ETests/E2EReport.swift
    dependencies:
      - target: Tern
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astemo6.mihomo.unittests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tern.app/Tern"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_ENTITLEMENTS: ""

  # feat/nc-e2e: E2E replay stage 2 — NativeCore in-process. Compiles the PacketTunnel target's sources (same
  # excludes, bridging header, lwIP headers and TERN_TUNNEL as project.yml) next to E2ETests/, hosted in the app so
  # it shares the app container with stage 1. Never imports the Tern app module (that would make every Shared type
  # ambiguous). Only the TernE2E scheme builds it (.github/workflows/e2e-replay.yml); the TernUITests scheme and the
  # release project are unchanged.
  TernE2ETunnelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: E2ETests
      - path: PacketTunnel
        excludes: ["**/*.entitlements", "Info.plist", "NativeMitM/Script/TernPrelude.js"]
      - path: Shared
        excludes: ["LiveActivityShared.swift", "LiveActivityViews.swift", "TunnelControl.swift"]
    dependencies:
      - target: Tern
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astemo6.mihomo.e2etests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tern.app/Tern"
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_ENTITLEMENTS: ""
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/NativeCore/NCBridge.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/PacketTunnel/NativeCore/lwip
          - $(PROJECT_DIR)/PacketTunnel/NativeCore/lwip/include
          - $(PROJECT_DIR)/PacketTunnel/NativeCore/lwip/port
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TERN_TUNNEL

schemes:
  # feat/nc-e2e: e2e-replay.yml only.
  TernE2E:
    build:
      targets:
        Tern: all
        TernUnitTests: [test]
        TernE2ETunnelTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: TernUnitTests
        - name: TernE2ETunnelTests
  TernUITests:
    build:
      targets:
        Tern: all
        TernUITests: [test]
        TernUnitTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: TernUnitTests
        - name: TernUITests
