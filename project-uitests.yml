# test/selftest: the app project plus a simulator UI test target. Used only by .github/workflows/ui-tests.yml
# (`xcodegen generate --spec project-uitests.yml`); the release build keeps using project.yml unchanged.
include:
  - path: project.yml

targets:
  MihomoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
      # The app's String Catalog, so the tests look up the same labels in zh-Hans and en.
      - path: App/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: Mihomo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astemo6.mihomo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mihomo
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_ENTITLEMENTS: ""

  # v0.19.5: Swift unit tests (backup / restore, CoreOverrides decoding, SubscriptionUserInfo, RouteSpec,
  # ProfileStore merge + header names), hosted in the app so `@testable import Mihomo` reaches internal types.
  MihomoUnitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UnitTests
      # nc-integrate: astemo6/Muse's NativeCore kernel tests (Shared/NativeCore: Snell, SS2022, SSR, AnyTLS, mux, H2/HPACK,
      # QUIC, Argon2, chains, legacy canonical) were in AppTests/ but in no target; they run in this bundle now.
      - path: AppTests
    dependencies:
      - target: Mihomo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astemo6.mihomo.unittests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mihomo.app/Mihomo"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  MihomoUITests:
    build:
      targets:
        Mihomo: all
        MihomoUITests: [test]
        MihomoUnitTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: MihomoUnitTests
        - name: MihomoUITests
