# 构建 Libmihomo.xcframework（gomobile）→ XcodeGen 生成工程 → xcodebuild archive → IPA → GitHub Release
# 有签名 secrets 时导出已签名 IPA；否则输出带 entitlements 的未签名（伪签）IPA，供自签工具重签。
name: iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: Compile only (no GitHub Release)
        type: boolean
        required: false
        default: false
  # Called by core-update.yml to test-build a core bump on a branch before it reaches main.
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: false
        default: ""
      build_only:
        description: Skip publishing the GitHub Release
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: ios-${{ inputs.ref || github.ref }}-${{ inputs.build_only && 'test' || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
      TUNNEL_PROFILE_BASE64: ${{ secrets.TUNNEL_PROFILE_BASE64 }}
      WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROFILE_BASE64 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Core version (from bridge/go.mod)
        run: |
          V=$(awk '$1=="github.com/metacubex/mihomo"{print $2; exit}' bridge/go.mod)
          test -n "$V"
          echo "MIHOMO_VERSION=$V" >> "$GITHUB_ENV"
          echo "mihomo core: $V"

      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+)\.app/\1 &/' | grep -v -i beta | sort -V | tail -n1 | cut -d' ' -f2)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Cache Libmihomo.xcframework
        id: fwcache
        uses: actions/cache/restore@v4
        with:
          path: Frameworks/Libmihomo.xcframework
          key: libmihomo-${{ env.MIHOMO_VERSION }}-${{ hashFiles('bridge/**', '.github/workflows/ios.yml') }}

      - name: Build Libmihomo.xcframework (gomobile)
        if: steps.fwcache.outputs.cache-hit != 'true'
        working-directory: bridge
        run: |
          set -euo pipefail
          MOBILE_VER=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@"$MOBILE_VER" golang.org/x/mobile/cmd/gobind@"$MOBILE_VER"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          mkdir -p ../Frameworks
          gomobile bind -target=ios/arm64 -iosversion=15.0 -tags with_gvisor -trimpath \
            -ldflags "-s -w -buildid= -X github.com/metacubex/mihomo/constant.Version=${MIHOMO_VERSION} -X github.com/astemo6/mihomo-ios/bridge.CoreVersion=${MIHOMO_VERSION}" \
            -o ../Frameworks/Libmihomo.xcframework . 2>&1 | tee ../gomobile.log
          ls -la ../Frameworks/Libmihomo.xcframework
          du -sh ../Frameworks/Libmihomo.xcframework

      # Saved right away (not in the post step) so a later Swift compile error does not discard it.
      - name: Save Libmihomo.xcframework cache
        if: steps.fwcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Frameworks/Libmihomo.xcframework
          key: ${{ steps.fwcache.outputs.cache-primary-key }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Read identifiers
        run: |
          APP_ID=$(awk '/^ *APP_BUNDLE_ID:/{print $2; exit}' project.yml)
          TUN_ID=$(awk '/^ *TUNNEL_BUNDLE_ID:/{print $2; exit}' project.yml)
          WID_ID=$(awk '/^ *WIDGET_BUNDLE_ID:/{print $2; exit}' project.yml)
          GROUP_ID=$(awk '/^ *APP_GROUP_ID:/{print $2; exit}' project.yml)
          VER=$(awk -F'"' '/MARKETING_VERSION/{print $2; exit}' project.yml)
          {
            echo "APP_ID=$APP_ID"; echo "TUN_ID=$TUN_ID"; echo "WID_ID=$WID_ID"; echo "GROUP_ID=$GROUP_ID"; echo "VER=$VER"
            echo "TAG=v${VER}-build${{ github.run_number }}"
            if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$APP_PROFILE_BASE64" ] && [ -n "$TUNNEL_PROFILE_BASE64" ] && [ -n "$TEAM_ID" ]; then
              echo "SIGNED=1"
            else
              echo "SIGNED=0"
            fi
          } >> "$GITHUB_ENV"

      - name: Import signing assets
        if: env.SIGNED == '1'
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          KP="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk -F'"' 'NR==1{print $2}')
          echo "Signing identity: $IDENTITY"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          install_profile() {
            local b64="$1" out="$RUNNER_TEMP/$2.mobileprovision"
            echo "$b64" | base64 --decode > "$out"
            security cms -D -i "$out" > "$RUNNER_TEMP/$2.plist"
            local uuid name
            uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/$2.plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/$2.plist")
            cp "$out" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            cp "$out" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            echo "$name"
          }
          APP_PROFILE=$(install_profile "$APP_PROFILE_BASE64" app)
          TUN_PROFILE=$(install_profile "$TUNNEL_PROFILE_BASE64" tunnel)
          echo "App profile: $APP_PROFILE / Tunnel profile: $TUN_PROFILE"
          # The widget extension needs its own profile (WIDGET_PROFILE_BASE64); without it reuse the app's.
          if [ -n "$WIDGET_PROFILE_BASE64" ]; then WID_PROFILE=$(install_profile "$WIDGET_PROFILE_BASE64" widget); else WID_PROFILE="$APP_PROFILE"; fi
          printf 'DEVELOPMENT_TEAM = %s\nCODE_SIGN_IDENTITY = %s\nPROVISIONING_PROFILE_SPECIFIER = %s\n' "$TEAM_ID" "$IDENTITY" "$APP_PROFILE" > Config/App.signing.xcconfig
          printf 'DEVELOPMENT_TEAM = %s\nCODE_SIGN_IDENTITY = %s\nPROVISIONING_PROFILE_SPECIFIER = %s\n' "$TEAM_ID" "$IDENTITY" "$TUN_PROFILE" > Config/Tunnel.signing.xcconfig
          printf 'DEVELOPMENT_TEAM = %s\nCODE_SIGN_IDENTITY = %s\nPROVISIONING_PROFILE_SPECIFIER = %s\n' "$TEAM_ID" "$IDENTITY" "$WID_PROFILE" > Config/Widget.signing.xcconfig
          METHOD="${EXPORT_METHOD:-development}"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key><dict>
              <key>${APP_ID}</key><string>${APP_PROFILE}</string>
              <key>${TUN_ID}</key><string>${TUN_PROFILE}</string>
              <key>${WID_ID}</key><string>${WID_PROFILE}</string>
            </dict>
          </dict></plist>
          EOF
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          EXTRA=()
          if [ "$SIGNED" != "1" ]; then
            EXTRA=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="")
          fi
          xcodebuild -project Mihomo.xcodeproj -scheme Mihomo -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/Mihomo.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${EXTRA[@]}" archive 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|\*\* (ARCHIVE|BUILD)" | head -n 200 || true
          test -d build/Mihomo.xcarchive/Products/Applications/Mihomo.app

      # i18n tooling: the compiler-extracted string tables (keys with format specifiers) for the catalog.
      - name: Collect extracted strings
        if: always()
        run: |
          mkdir -p stringsdata
          find "$HOME/Library/Developer/Xcode/DerivedData" -name '*.stringsdata' -path '*Mihomo.build*' -exec cp {} stringsdata/ \; 2>/dev/null || true
          ls stringsdata | wc -l

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stringsdata
          path: stringsdata
          if-no-files-found: ignore
          retention-days: 7

      - name: Export signed IPA
        if: env.SIGNED == '1'
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/Mihomo.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export 2>&1 | tee export.log | tail -n 40
          IPA="Mihomo-${VER}-build${{ github.run_number }}-signed.ipa"
          mv build/export/*.ipa "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      # v0.19: only the "-widget" static IPA is built (app + tunnel + widget / Control Center extension); the plain
      # IPA without the widget is no longer shipped (user decision 2026-10-18). The shared-core variant follows below.
      # $IPA is the widget IPA from here on, so the size / inspect / shared-core checks run on it.
      - name: Package unsigned IPA (entitlements embedded via ad-hoc signature)
        if: env.SIGNED != '1'
        run: |
          set -euo pipefail
          APP=build/Mihomo.xcarchive/Products/Applications/Mihomo.app
          sed "s/\$(APP_GROUP_ID)/${GROUP_ID}/g" PacketTunnel/PacketTunnel.entitlements > tunnel.entitlements
          sed "s/\$(APP_GROUP_ID)/${GROUP_ID}/g" App/Mihomo.entitlements > app.entitlements
          sed "s/\$(APP_GROUP_ID)/${GROUP_ID}/g" Widget/MihomoWidget.entitlements > widget.entitlements
          plutil -lint tunnel.entitlements app.entitlements widget.entitlements
          test -d "$APP/PlugIns/MihomoWidget.appex"
          codesign -f -s - --entitlements tunnel.entitlements "$APP/PlugIns/PacketTunnel.appex"
          codesign -f -s - --entitlements widget.entitlements "$APP/PlugIns/MihomoWidget.appex"
          codesign -f -s - --entitlements app.entitlements "$APP"
          echo "--- appex entitlements ---"; codesign -d --entitlements - "$APP/PlugIns/PacketTunnel.appex" 2>&1 | tail -n 20
          echo "--- widget entitlements ---"; codesign -d --entitlements - "$APP/PlugIns/MihomoWidget.appex" 2>&1 | tail -n 20
          echo "--- app entitlements ---"; codesign -d --entitlements - "$APP" 2>&1 | tail -n 20
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          IPA="Mihomo-${VER}-build${{ github.run_number }}-widget-unsigned.ipa"
          zip -qry -9 "$IPA" Payload
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: IPA size report
        run: |
          set -euo pipefail
          for f in "$IPA"; do
            echo "===== $f ($(stat -f%z "$f") B) ====="
            python3 scripts/ipa_size.py "$f"
          done

      - name: Inspect IPA
        run: |
          ls -la "$IPA"
          unzip -l "$IPA" | grep -E "Mihomo.app/(Mihomo|Info.plist)$|PacketTunnel.appex/(PacketTunnel|Info.plist)$"
          if [ "$SIGNED" != "1" ]; then
            unzip -l "$IPA" | grep -E "MihomoWidget.appex/(MihomoWidget|Info.plist)$"
            unzip -p "$IPA" Payload/Mihomo.app/PlugIns/MihomoWidget.appex/Info.plist > /tmp/wid.plist && plutil -p /tmp/wid.plist | grep -E "NSExtensionPointIdentifier|CFBundleIdentifier|MinimumOSVersion"
          fi
          unzip -p "$IPA" Payload/Mihomo.app/PlugIns/PacketTunnel.appex/Info.plist > /tmp/ext.plist && plutil -p /tmp/ext.plist | grep -E "NSExtension|Mihomo|CFBundleIdentifier"
          {
            echo "### $IPA"
            echo "- mihomo ${MIHOMO_VERSION}, signed=${SIGNED}"
            echo "- size: $(du -h "$IPA" | cut -f1)"
            echo "- app binary: $(unzip -l "$IPA" | awk '$4=="Payload/Mihomo.app/Mihomo"{printf "%.1f MB", $1/1048576}')"
            echo "- PacketTunnel binary: $(unzip -l "$IPA" | awk '$4=="Payload/Mihomo.app/PlugIns/PacketTunnel.appex/PacketTunnel"{printf "%.1f MB", $1/1048576}')"
            echo "- PacketTunnel.appex total: $(unzip -l "$IPA" | awk '$4 ~ /PacketTunnel.appex\//{s+=$1} END{printf "%.1f MB", s/1048576}')"
            echo "- MihomoWidget.appex: $(unzip -l "$IPA" | awk '$4 ~ /MihomoWidget.appex\//{s+=$1} END{printf "%.1f MB", s/1048576}')"
          } >> "$GITHUB_STEP_SUMMARY"

      # v0.15 test variant: ONE dynamic Libmihomo.framework embedded in Mihomo.app/Frameworks and loaded by the
      # tunnel via @rpath (@executable_path/../../Frameworks). The normal IPAs above keep static linking.
      # Unsigned flow only. No widget in this variant (the widget never links the core).
      - name: Shared-core variant (dynamic Libmihomo.framework)
        if: env.SIGNED != '1'
        run: |
          set -euo pipefail
          bash scripts/shared_core.sh Frameworks/Libmihomo.xcframework FrameworksShared "$APP_ID" "$VER" 2>&1 | tee shared-core.log
          python3 scripts/shared_project.py project.yml project-shared.yml
          xcodegen generate --spec project-shared.yml
          xcodebuild -project Mihomo.xcodeproj -scheme Mihomo -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/MihomoShared.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            archive 2>&1 | tee build-shared.log | grep -E "error:|\*\* (ARCHIVE|BUILD)" | head -n 200 || true
          APP=build/MihomoShared.xcarchive/Products/Applications/Mihomo.app
          FW="$APP/Frameworks/Libmihomo.framework"
          test -f "$FW/Libmihomo"
          rm -rf "$FW/Headers" "$FW/Modules" "$FW/_CodeSignature" "$APP/PlugIns/MihomoWidget.appex"
          test ! -e "$APP/PlugIns/PacketTunnel.appex/Frameworks"
          echo "--- linkage ---"
          otool -L "$APP/Mihomo" | grep -F "@rpath/Libmihomo.framework/Libmihomo"
          otool -L "$APP/PlugIns/PacketTunnel.appex/PacketTunnel" | grep -F "@rpath/Libmihomo.framework/Libmihomo"
          otool -l "$APP/PlugIns/PacketTunnel.appex/PacketTunnel" | grep -A2 LC_RPATH | grep -F "@executable_path/../../Frameworks"
          otool -l "$APP/Mihomo" | grep -A2 LC_RPATH | grep -F "@executable_path/Frameworks"
          ls -la "$APP/Mihomo" "$APP/PlugIns/PacketTunnel.appex/PacketTunnel" "$FW/Libmihomo"
          # Same order a re-signer uses: framework (no entitlements, no profile) → extension → app.
          codesign -f -s - "$FW"
          codesign -f -s - --entitlements tunnel.entitlements "$APP/PlugIns/PacketTunnel.appex"
          codesign -f -s - --entitlements app.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          IPA_SHARED="Mihomo-${VER}-build${{ github.run_number }}-sharedcore-unsigned.ipa"
          zip -qry -9 "$IPA_SHARED" Payload
          echo "IPA_SHARED=$IPA_SHARED" >> "$GITHUB_ENV"
          echo "===== $IPA_SHARED ($(stat -f%z "$IPA_SHARED") B) ====="
          python3 scripts/ipa_size.py "$IPA_SHARED" --shared-core
          # Launch-crash guards (install name, rpaths, system-only deps, minos, one Go runtime per process, framework
          # Info.plist, signatures; static IPAs still static) + the size report of BOTH variants for the step summary.
          python3 scripts/shared_check.py "$IPA_SHARED" "$IPA" --summary "$GITHUB_STEP_SUMMARY"

      # Re-sign check: a real (self-signed, trusted for code signing) identity signs the shared-core app the way
      # one-profile re-signers do — framework without entitlements, then extension and app with theirs.
      - name: Shared-core re-sign check
        if: env.SIGNED != '1' && env.IPA_SHARED != ''
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/resign"; mkdir -p "$T"; cd "$T"
          cat > cs.cnf <<'CNF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = Mihomo Resign Test
          [ext]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          CNF
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 2 -config cs.cnf -keyout key.pem -out cert.pem
          /usr/bin/openssl pkcs12 -export -inkey key.pem -in cert.pem -out id.p12 -passout pass:resign
          KC="$T/resign.keychain-db"
          security create-keychain -p resign "$KC"
          security unlock-keychain -p resign "$KC"
          security import id.p12 -P resign -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k resign "$KC" >/dev/null
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          rm -rf Payload && unzip -q "$GITHUB_WORKSPACE/$IPA_SHARED"
          APP=Payload/Mihomo.app
          codesign -f -s "Mihomo Resign Test" --keychain "$KC" "$APP/Frameworks/Libmihomo.framework"
          codesign -f -s "Mihomo Resign Test" --keychain "$KC" --entitlements "$GITHUB_WORKSPACE/tunnel.entitlements" "$APP/PlugIns/PacketTunnel.appex"
          codesign -f -s "Mihomo Resign Test" --keychain "$KC" --entitlements "$GITHUB_WORKSPACE/app.entitlements" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP/Frameworks/Libmihomo.framework" 2>&1 | grep -E "Identifier|Authority|TeamIdentifier|Format"
          # dyld / AMFI only let the tunnel load an app framework signed by the same team: all three must match.
          for b in "$APP/Frameworks/Libmihomo.framework" "$APP/PlugIns/PacketTunnel.appex" "$APP"; do
            codesign -dv "$b" 2>&1 | grep -E "^(Authority|TeamIdentifier)=" | sort | tr '\n' ' '; echo
          done | sort -u > signers.txt
          cat signers.txt
          test "$(wc -l < signers.txt)" -eq 1
          test -z "$(codesign -d --entitlements - "$APP/Frameworks/Libmihomo.framework" 2>/dev/null | grep -F '<key>')"
          zip -qry resigned.ipa Payload
          python3 "$GITHUB_WORKSPACE/scripts/shared_check.py" resigned.ipa "$GITHUB_WORKSPACE/$IPA" | tail -n 1
          echo "- re-sign check: framework + tunnel + app signed with one identity, codesign --verify --deep --strict OK" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Mihomo-ipa
          path: |
            ${{ env.IPA }}
            ${{ env.IPA_SHARED }}
            app.entitlements
            tunnel.entitlements
            widget.entitlements
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: ${{ !inputs.build_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "Mihomo iOS ${VER}（构建 #${{ github.run_number }}，提交 $(git rev-parse --short HEAD)）"
            echo
            echo "- 内核：mihomo ${MIHOMO_VERSION}"
            if [ "$SIGNED" = "1" ]; then
              echo "- 已签名（${EXPORT_METHOD:-development}），可直接安装到描述文件内的设备。"
            else
              echo "- 未签名（已嵌入 entitlements 的伪签名），请用自己的证书和描述文件重签后安装。网络扩展需要开启了 Network Extension + App Groups 能力的描述文件。"
              echo "- \`-widget-unsigned.ipa\`：主程序 + 隧道扩展 + 小组件 / 控制中心开关扩展（Bundle ID 为 主 ID + .widget，需要描述文件也覆盖它，例如显式 App ID 的描述文件配合能处理扩展的重签工具）。不含小组件的普通版自 v0.19 起不再发布。"
              if [ -n "${IPA_SHARED:-}" ]; then
                echo "- 测试版 \`-sharedcore-unsigned.ipa\`：内核只打包一次（Mihomo.app/Frameworks/Libmihomo.framework，隧道扩展通过 @rpath 加载），体积更小；不含小组件。重签时框架只需签名、不需要描述文件。尚待真机验证，出问题请改用 -widget 版。"
              fi
            fi
          } > "$NOTES"
          FILES=("$IPA")
          [ -n "${IPA_SHARED:-}" ] && [ -f "$IPA_SHARED" ] && FILES+=("$IPA_SHARED")
          [ -f app.entitlements ] && FILES+=(app.entitlements tunnel.entitlements)
          [ -f widget.entitlements ] && FILES+=(widget.entitlements)
          gh release create "$TAG" "${FILES[@]}" --title "Mihomo ${VER} build ${{ github.run_number }}" --notes-file "$NOTES" --target "$(git rev-parse HEAD)" --prerelease

      - name: Show build errors (on failure)
        if: failure()
        run: |
          for f in gomobile.log build.log export.log shared-core.log build-shared.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -E "error:|Error|FAILED|fatal" "$f" | sort -u | head -n 150 || true
            echo "----- tail -----"
            tail -n 60 "$f"
          done
