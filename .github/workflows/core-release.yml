# 发布内核升级的发版候选 —— 维护者的明确批准（F 线 2026-10-24）。
# core-update.yml 在 core/mihomo-<tag> 的 CI 全绿后产出 artifact「core-candidate-<tag>」，但从不发布。
# 维护者确认要发时手动运行本 workflow：
#   Actions → Core release (manual) → Run workflow：run_id = 那次 Core auto-update 的 run id，confirm = mihomo tag
#   或：gh workflow run core-release.yml -R astemo6/mihomo-ios -f run_id=<id> -f confirm=v1.19.xx
# 它只做一件事：把候选里已经测过的 IPA 原样发成 GitHub prerelease（tag v<版本>-build<构建号>-mihomo-<tag>，
# 指向 core 分支上被测的那个提交）。不推送、不合并默认分支，不重新构建。
# 拒绝发布：候选 run 不是 Core auto-update / candidate 作业没通过 / confirm 与候选不符 / 校验和不符 /
# core 分支在候选之后又有新提交（需先 rebuild 重测）/ 同名 release 已存在。
name: Core release (manual)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Core auto-update 的 run id（candidate 作业通过的那次）"
        type: string
        required: true
      confirm:
        description: "再输入一次 mihomo 版本（如 v1.19.34）以确认发布"
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: core-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'astemo6/mihomo-ios'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Verify the candidate run
        run: |
          set -euo pipefail
          echo "$RUN_ID" | grep -Eq '^[0-9]+$' || { echo "run_id must be a number"; exit 1; }
          WF=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .path)
          [ "$WF" = ".github/workflows/core-update.yml" ] || { echo "run $RUN_ID is $WF, not Core auto-update"; exit 1; }
          CAND=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name == "candidate")][-1].conclusion')
          [ "$CAND" = success ] || { echo "candidate job of run $RUN_ID: ${CAND:-missing} (needs success)"; exit 1; }

      - uses: actions/download-artifact@v7
        with:
          pattern: core-candidate-*
          path: candidate
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check manifest, checksums and branch
        run: |
          set -euo pipefail
          cd candidate
          cat manifest.json
          TAG=$(jq -r .mihomo manifest.json); SHA=$(jq -r .sha manifest.json); BR=$(jq -r .branch manifest.json)
          BUILD=$(jq -r .build manifest.json)
          [ "$TAG" = "$CONFIRM" ] || { echo "confirm '$CONFIRM' does not match the candidate's mihomo $TAG"; exit 1; }
          sha256sum -c SHA256SUMS
          HEAD=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BR" --jq .commit.sha)
          [ "$HEAD" = "$SHA" ] || { echo "$BR moved to ${HEAD::7} after the candidate (${SHA::7}) was tested — run Core auto-update with tag=$TAG rebuild=true first"; exit 1; }
          VER=$(gh api "repos/$GITHUB_REPOSITORY/contents/project.yml?ref=$SHA" --jq .content | base64 -d | awk -F'"' '/MARKETING_VERSION/{print $2; exit}')
          test -n "$VER"
          RTAG="v${VER}-build${BUILD}-mihomo-${TAG}"
          if gh release view "$RTAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "release $RTAG already exists"; exit 1; fi
          { echo "TAG=$TAG"; echo "SHA=$SHA"; echo "BR=$BR"; echo "BUILD=$BUILD"; echo "VER=$VER"; echo "RTAG=$RTAG"; } >> "$GITHUB_ENV"

      - name: Publish prerelease (approved by ${{ github.actor }})
        run: |
          set -euo pipefail
          cd candidate
          SIGNED=$(jq -r .signed manifest.json)
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "Mihomo iOS ${VER}（构建 #${BUILD}，提交 ${SHA::7}）— 内核升级候选：mihomo ${TAG}"
            echo
            echo "- 分支 \`${BR}\`（未合并到默认分支）；Checks、Self-test（Go -race + UI）、测试构建均已通过：$(jq -r .run_url manifest.json)"
            echo "- 由 @${GITHUB_ACTOR} 批准发布（Core release run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID）"
            if [ "$SIGNED" = true ]; then
              echo "- 已签名 IPA。"
            else
              echo "- 未签名（已嵌入 entitlements 的伪签名），请用自己的证书和描述文件重签后安装。"
            fi
          } > "$NOTES"
          mapfile -t FILES < <(jq -r '.files[].name' manifest.json)
          FILES+=(SHA256SUMS manifest.json)
          gh release create "$RTAG" "${FILES[@]}" -R "$GITHUB_REPOSITORY" --title "Mihomo ${VER} build ${BUILD} (mihomo ${TAG})" \
            --notes-file "$NOTES" --target "$SHA" --prerelease
          echo "### 已发布 prerelease $RTAG（mihomo $TAG，提交 ${SHA::7}），默认分支未改动" >> "$GITHUB_STEP_SUMMARY"
