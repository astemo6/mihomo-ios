# test/selftest: self-tests without a device. Runs on pushes to test/** branches (a workflow_dispatch workflow
# must exist on the default branch before it can be dispatched) and by workflow_dispatch with run_tests=true
# once merged. Never releases. A commit message containing [only:<testName>] runs just that UI test ([unit:<Class>] adds a unit test class), [skip-go]
# skips the Go job.
# - go: go vet + the whole bridge test suite with the race detector (Linux).
# - ui: XCUITest target (project-uitests.yml) on an iOS simulator with the synthetic -UITestSeed profile,
#   zh-Hans and en, light and dark. Screenshots and per-test reports are uploaded as artifacts only.
# The release workflow (ios.yml) and project.yml are not touched by this file.
# Org mirror sharding (doubles concurrent macOS runners; free plan = 5 macOS jobs per account/org):
#   astemo6/mihomo-ios   → go + ui zh-Hans light/dark
#   astemo666/mihomo-ios → ui en light/dark (no go)
#   any other repo       → everything
# Full matrix in one repo: workflow_dispatch shard=all, or [shard:all] in the pushed commit message.
# scripts/selftest-split.sh pushes a test/** branch to both remotes and waits for both runs.
name: Self-test

on:
  push:
    branches: ['test/**']
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the self-tests
        type: boolean
        required: false
        default: true
      only:
        description: "Optional -only-testing filter, e.g. MihomoUITests/MihomoUITests/test04_NodeManager"
        type: string
        required: false
        default: ""
      skip_go:
        description: Skip the Go job
        type: boolean
        required: false
        default: false
      shard:
        description: "auto = split by repository (astemo6 go+zh-Hans, astemo666 en); all = full matrix here"
        type: choice
        options: [auto, all]
        required: false
        default: auto

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    if: ${{ ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-go]')) || (inputs.run_tests && !inputs.skip_go)) && (github.repository != 'astemo666/mihomo-ios' || inputs.shard == 'all' || contains(github.event.head_commit.message, '[shard:all]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - name: go vet
        working-directory: bridge
        run: go vet ./... 2>&1 | tee ../go-vet.log
      # 1) The suite without the race detector; tests that fail are retried once on their own (several
      #    download geo data / reach public endpoints and flake on the runner's network).
      - name: go test
        if: always()
        working-directory: bridge
        run: |
          set +e
          go test -count=1 -timeout 30m ./... 2>&1 | tee ../go-test.log
          RC=${PIPESTATUS[0]}
          [ "$RC" = 0 ] && exit 0
          FAILED=$(grep -E "^--- FAIL: " ../go-test.log | awk '{print $3}' | sort -u | paste -sd'|' -)
          echo "failed first run: $FAILED"
          [ -n "$FAILED" ] || exit "$RC"
          go test -count=1 -timeout 15m -run "^(${FAILED})\$" ./... 2>&1 | tee ../go-test-retry.log
          RC2=${PIPESTATUS[0]}
          echo "### go test" >> "$GITHUB_STEP_SUMMARY"
          echo "- first run failed: ${FAILED//|/, }; retry exit $RC2" >> "$GITHUB_STEP_SUMMARY"
          exit "$RC2"
      # 1b) v0.18: tests that need the real Tailscale outbound (tsnet + gVisor), built with the app's tag.
      - name: go test (with_gvisor)
        if: always()
        working-directory: bridge
        run: go test -tags with_gvisor -count=1 -timeout 10m -run 'TestV018' . 2>&1 | tee ../go-test-gvisor.log
      # 2) The race detector; reports are classified (scripts/race_check.py): races in this repository's
      #    code fail, races inside mihomo's config re-apply are listed as upstream.
      - name: go test -race
        if: always()
        working-directory: bridge
        run: |
          set +e
          go test -race -count=1 -timeout 30m ./... > ../go-test-race.log 2>&1
          RC=$?
          echo "go test -race exit $RC (failures from upstream races are expected)"
          grep -E "^(--- FAIL|ok |FAIL)" ../go-test-race.log | head -n 80
          # r7 R7A-12: the exit code counts too — only failures explained by upstream race reports pass.
          python3 ../scripts/race_check.py ../go-test-race.log --summary "$GITHUB_STEP_SUMMARY" --exit-code "$RC"
      - name: Failed tests (on failure)
        if: failure()
        run: |
          grep -E "^(--- FAIL|FAIL|panic:)" -A12 go-test.log go-test-retry.log 2>/dev/null | head -n 300 || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: go-test-logs
          path: |
            go-vet.log
            go-test.log
            go-test-retry.log
            go-test-race.log
            go-test-gvisor.log
          if-no-files-found: warn
          retention-days: 14

  ui:
    if: ${{ github.event_name == 'push' || inputs.run_tests }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Shard by repository (see header). Full list when shard=all, [shard:all], or an unknown repository.
        # Review 6 OPT-1: light is split in two test shards (:1 = test01–test30 since r7, :2 = the rest + unit tests, so new
        # tests land there automatically) — one light job took 72–80 min of the 120 min limit, now ~45 min each.
        combo: ${{ fromJSON(((inputs.shard == 'all' || contains(github.event.head_commit.message, '[shard:all]')) && '["zh-Hans:light:1","zh-Hans:light:2","zh-Hans:light:3","en:light:1","en:light:2","en:light:3","zh-Hans:dark:0","en:dark:0"]') || (github.repository == 'astemo666/mihomo-ios' && '["en:light:1","en:light:2","en:light:3","en:dark:0"]') || (github.repository == 'astemo6/mihomo-ios' && '["zh-Hans:light:1","zh-Hans:light:2","zh-Hans:light:3","zh-Hans:dark:0"]') || '["zh-Hans:light:1","zh-Hans:light:2","zh-Hans:light:3","en:light:1","en:light:2","en:light:3","zh-Hans:dark:0","en:dark:0"]') }}
    steps:
      - uses: actions/checkout@v5
      - name: Combo
        run: |
          combo="${{ matrix.combo }}"
          LANG_=${combo%%:*}; rest=${combo#*:}; STYLE=${rest%%:*}; SHARD=${rest#*:}
          SHORT=$([ "$LANG_" = zh-Hans ] && echo zh || echo "$LANG_")-$STYLE$([ "$SHARD" = 0 ] || echo "-$SHARD")
          { echo "LANG_=$LANG_"; echo "STYLE=$STYLE"; echo "SHARD=$SHARD"; echo "SHORT=$SHORT"; } >> "$GITHUB_ENV"
      # r7 (backlog B16): an explicit selection ([only:] / [unit:] / inputs.only) runs in light shard 1 only. Shard 2
      # used to build the framework, the project and the test bundle first and only then exit; it now skips them.
      - name: Selection
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ONLY_INPUT: ${{ inputs.only }}
        run: |
          SKIP=0
          if { [ "$SHARD" = 2 ] || [ "$SHARD" = 3 ]; } && { [ -n "$ONLY_INPUT" ] || printf '%s' "$COMMIT_MSG" | grep -qE '\[(only|unit):[A-Za-z0-9_]+\]'; }; then
            SKIP=1
            echo "only-testing selection runs in light shard 1; this shard skips build and tests"
          fi
          echo "SKIP_SHARD=$SKIP" >> "$GITHUB_ENV"
      - name: Core version
        if: env.SKIP_SHARD != '1'
        run: echo "MIHOMO_VERSION=$(awk '$1=="github.com/metacubex/mihomo"{print $2; exit}' bridge/go.mod)" >> "$GITHUB_ENV"
      - name: Select latest Xcode
        if: env.SKIP_SHARD != '1'
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+)\.app/\1 &/' | grep -v -i beta | sort -V | tail -n1 | cut -d' ' -f2)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-go@v6
        if: env.SKIP_SHARD != '1'
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - name: Cache simulator Libmihomo
        id: simfw
        if: env.SKIP_SHARD != '1'
        uses: actions/cache@v5
        with:
          path: Frameworks/Libmihomo.xcframework
          key: libmihomo-sim-${{ env.MIHOMO_VERSION }}-${{ hashFiles('bridge/**') }}
      - name: Build Libmihomo.xcframework (simulator)
        if: env.SKIP_SHARD != '1' && steps.simfw.outputs.cache-hit != 'true'
        working-directory: bridge
        run: |
          set -euo pipefail
          MOBILE_VER=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@"$MOBILE_VER" golang.org/x/mobile/cmd/gobind@"$MOBILE_VER"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          mkdir -p ../Frameworks
          gomobile bind -target=iossimulator/arm64 -iosversion=15.0 -tags with_gvisor -trimpath \
            -ldflags "-s -w -X github.com/metacubex/mihomo/constant.Version=${MIHOMO_VERSION} -X github.com/astemo6/mihomo-ios/bridge.CoreVersion=${MIHOMO_VERSION}" \
            -o ../Frameworks/Libmihomo.xcframework .
      - name: Generate project (with UI tests)
        if: env.SKIP_SHARD != '1'
        run: |
          brew install xcodegen
          xcodegen generate --spec project-uitests.yml
      - name: Pick simulator
        if: env.SKIP_SHARD != '1'
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          devs=[(r,x) for r,l in d.items() if 'iOS' in r for x in l]
          devs.sort(key=lambda rx: (0 if 'iOS-18' in rx[0] else 1, rx[0]))
          for want in ['iPhone 16 Pro','iPhone 17 Pro','iPhone 15 Pro','iPhone 16']:
              m=[(r,x) for r,x in devs if x['name']==want]
              if m: print(m[0][1]['udid']); sys.stderr.write('using %s on %s\\n' % (want, m[0][0])); break
          ")
          test -n "$DEV"
          echo "DEV=$DEV" >> "$GITHUB_ENV"
          # Review 6 OPT-4: boot only starts here; the wait (bootstatus, 1.8–3.5 min measured) overlaps the
          # build-for-testing step and happens right before the tests.
          xcrun simctl boot "$DEV" || true
      - name: Build for testing
        if: env.SKIP_SHARD != '1'
        run: |
          set -o pipefail
          xcodebuild -project Mihomo.xcodeproj -scheme MihomoUITests -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEV" -derivedDataPath build/uit \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            build-for-testing 2>&1 | tee build-uit.log | grep -E "error:|\*\* (TEST BUILD|BUILD)" || true
          # review 5 P2-10: no `| head` downstream of xcodebuild (SIGPIPE); full log in build-uit.log, tail on failure.
          grep -q "TEST BUILD SUCCEEDED" build-uit.log || { tail -n 150 build-uit.log; exit 1; }
      - name: Run UI tests
        if: env.SKIP_SHARD != '1'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ONLY_INPUT: ${{ inputs.only }}
        run: |
          set +e
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          mkdir -p shots results
          ONLY=()
          if [ -n "$ONLY_INPUT" ]; then ONLY=(-only-testing:"$ONLY_INPUT"); fi
          for t in $(printf '%s' "$COMMIT_MSG" | grep -oE '\[only:[A-Za-z0-9_]+\]' | sed -E 's/\[only:(.*)\]/\1/'); do
            ONLY+=(-only-testing:"MihomoUITests/MihomoUITests/$t")
          done
          # [unit:<TestClass>] adds a unit test class (MihomoUnitTests) to an [only:] selection.
          for t in $(printf '%s' "$COMMIT_MSG" | grep -oE '\[unit:[A-Za-z0-9_]+\]' | sed -E 's/\[unit:(.*)\]/\1/'); do
            ONLY+=(-only-testing:"MihomoUnitTests/$t")
          done
          DARK_ONLY=(-only-testing:MihomoUITests/MihomoUITests/test01_TabsAndHome -only-testing:MihomoUITests/MihomoUITests/test03_MoreEveryPage -only-testing:MihomoUITests/MihomoUITests/test04_NodeManager -only-testing:MihomoUITests/MihomoUITests/test05_AddNodeAndEditor)
          # Review 6 OPT-1: light shard 1 = these tests, shard 2 = everything else (new tests land there).
          # r7 (review7 R7A-9): test22–test30 (~8 min) moved to shard 1 — shard 2 had grown to ~61 min of tests with
          # test56–test70 (39596801011: light:1 34.9 min, light:2 60.8 min).
          SHARD1_TESTS="test01_TabsAndHome test02_HomePolicyPicker test03_MoreEveryPage test04_NodeManager test05_AddNodeAndEditor test06a_ImportQX test06b_ImportSurge test06c_ImportClash test06d_ImportLoon test06e_ImportLinks test07_Editors test08_ModulesAndPanels test09_AutoApplySettings test10_ProfileNodeEdit test11_RegionFilters test12_FilterSources test13_RuleChips test14_DNSLog test15_AllRewrites test16_PolicyModeControl test17_RequestsSummary test18_SSIDPermissions test19_RequestTimeline test20_NodeSettings test21_TileEditing test22_TailscaleNode test23_DiagnosticsMemory test24_SampleProfile test25_OverrideScripts test26_HomeTiles test27_LANDetail test28_WebDAV test29_UnlockServices test30_SettingsToggles"
          # 2026-10-23: light shard 2 had grown to ~63 min of UI tests; test31–test58 (~28 min) run in shard 3 in
          # parallel (4 macOS jobs per repo, free plan allows 5). Shard 2 keeps the rest + the unit tests.
          SHARD3_TESTS="test31_GroupOrder test32_RouteEditorSlash test33_RulesAndRewriteAddDelete test34_URLSchemeLinks test35_NodeEditUndo test36_LanguagesNoLeftovers test37_SettingsPersistAcrossRelaunch test38_ProfileSwitch test39_BigProfileResponsive test40_FilterRenameAndIcon test42_GroupReorderBothWays test43_ModeGlobalVisibility test44_HomeUnlockTileAndScriptTasks test45_RuleFormDefaults test46_LogsNotEmptyOnFirstOpen test47_SnapshotMultiDelete test49_SurgeUIShots test50_HomeExitSubtitle test51_PolicyChainShots test56_ProfileSubscriptionSwipe test57_GroupLongPressMenu test58_SubsSplitProviderActions"
          FAILED=""
          SEL=("${ONLY[@]}")
          if [ ${#SEL[@]} -gt 0 ] && { [ "$SHARD" = 2 ] || [ "$SHARD" = 3 ]; }; then
            # An explicit [only:] / inputs.only selection runs once, in shard 1.
            echo "only-testing selection runs in light shard 1; nothing to do here"
            echo "FAILED=" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ ${#SEL[@]} -eq 0 ] && [ "$STYLE" = dark ]; then SEL=("${DARK_ONLY[@]}"); fi
          if [ ${#SEL[@]} -eq 0 ] && [ "$SHARD" = 1 ]; then
            for t in $SHARD1_TESTS; do SEL+=(-only-testing:"MihomoUITests/MihomoUITests/$t"); done
          fi
          if [ ${#SEL[@]} -eq 0 ] && [ "$SHARD" = 2 ]; then
            for t in $SHARD1_TESTS $SHARD3_TESTS; do SEL+=(-skip-testing:"MihomoUITests/MihomoUITests/$t"); done
          fi
          if [ ${#SEL[@]} -eq 0 ] && [ "$SHARD" = 3 ]; then
            for t in $SHARD3_TESTS; do SEL+=(-only-testing:"MihomoUITests/MihomoUITests/$t"); done
          fi
          xcrun simctl ui "$DEV" appearance "$STYLE" || true
          # feat/jsc-engine: JavaScriptCore without JIT in the test host, as on a device (no JIT for apps and
          # extensions). Round 2 (8e86e33): with JIT the busy-loop case was never terminated by the time limit.
          TEST_RUNNER_UI_LANG="$LANG_" TEST_RUNNER_UI_STYLE="$STYLE" TEST_RUNNER_UI_SHOT_DIR="$PWD/shots" TEST_RUNNER_JSC_useJIT=false \
          xcodebuild -project Mihomo.xcodeproj -scheme MihomoUITests -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEV" -derivedDataPath build/uit -resultBundlePath "results/$SHORT.xcresult" \
            "${SEL[@]}" test-without-building 2>&1 | tee "results/$SHORT.log" | grep -E "Test Case|error:|failed|passed|XCTAssert|issue"
          RC=${PIPESTATUS[0]}
          # review 5 P2-10: grep reads to EOF (no `| head`), so SIGPIPE can no longer end the test run early.
          echo "$SHORT exit $RC"
          [ "$RC" = 0 ] || tail -n 120 "results/$SHORT.log"
          [ "$RC" = 0 ] || FAILED="$FAILED $SHORT"
          {
            echo "### UI self-test"
            for f in shots/*/report-*.md; do
              [ -f "$f" ] || continue
              n=$(sed -n '/^## issues/,/^## warnings/p' "$f" | grep -c '^\[' || true)
              echo "- $(basename "$(dirname "$f")") $(basename "$f" .md): $n issue(s)"
            done
            echo "- failed combos:${FAILED:- none}"
          } >> "$GITHUB_STEP_SUMMARY"
          cat shots/*/report-*.md 2>/dev/null | grep -E "^\[|^# " | head -n 400
          echo "FAILED=$FAILED" >> "$GITHUB_ENV"
      - name: Crash logs
        if: always() && env.SKIP_SHARD != '1'
        run: |
          mkdir -p crashes
          cp ~/Library/Logs/DiagnosticReports/Mihomo* crashes/ 2>/dev/null || true
          find "$HOME/Library/Developer/CoreSimulator/Devices/$DEV" -name "Mihomo*.ips" -exec cp {} crashes/ \; 2>/dev/null || true
          ls -la crashes
      - uses: actions/upload-artifact@v6
        if: always() && env.SKIP_SHARD != '1'
        with:
          name: ui-screens-${{ env.SHORT }}
          path: |
            shots/
            crashes/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always() && env.SKIP_SHARD != '1'
        with:
          name: ui-results-${{ env.SHORT }}
          path: |
            results/*.log
            build-uit.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always() && env.SKIP_SHARD != '1'
        with:
          name: ui-xcresult-${{ env.SHORT }}
          path: results/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Result
        run: |
          if [ -n "$FAILED" ]; then echo "UI tests failed:$FAILED"; exit 1; fi
