# test/selftest: self-tests without a device. Runs on pushes to test/** branches (a workflow_dispatch workflow
# must exist on the default branch before it can be dispatched) and by workflow_dispatch with run_tests=true
# once merged. Never releases. A commit message containing [only:<testName>] runs just that UI test ([unit:<Class>] adds a unit test class),
# [skip-ui] skips the UI shards.
# - dedupe + plan (ubuntu, seconds): identical-SHA dedupe, UI path (smoke / full matrix, see "UI path" below), extras.
# - build-ui (macOS, once): build-for-testing of the TernUITests scheme → artifact (.github/workflows/build-for-testing.yml).
# - ui (macOS matrix): every combo runs `test-without-building` on those products (.github/actions/tern-prebuilt) —
#   XCUITest target (project-uitests.yml) on an iOS simulator with the synthetic -UITestSeed profile, zh-Hans and en,
#   light and dark. Screenshots and per-test reports are uploaded as artifacts only.
# - unit (macOS, once): the whole TernUnitTests bundle on the same products (queued after the IPA build when the run has one).
# The release workflow (ios.yml) and project.yml are not touched by this file.
#
# ci/speedup (2026-10-27, report work/nc/ci-speedup-report.md):
# - one build per run instead of one per combo (each combo built for 6–15 min before);
# - the full matrix of a language is N jobs "<lang>:K/N", each = a share of the light tests + a share of the
#   dark-appearance checks (test01/03/04/05, the old dark:0 job), balanced on measured durations (scripts/ci/ui-shards.py
#   + ui-test-times.tsv; tests are read from UITests/*.swift, so new tests are scheduled automatically; job N's light
#   part = the rest of TernUITests). N = 4 (~35 min of tests each) when the repository's runners also carry the unit
#   combo / E2E / IPA / proto-loopback of the same run, else 5 (~28 min). The old light:1/2/3 + dark:0 ran 13–61 min;
# - the unit tests run once, in their own `unit` combo, instead of inside light shard 2 of both languages (the en
#   mirror's copy was the identical bundle on an identical simulator; UI_LANG / UI_STYLE are read by UI tests only);
# - an explicit selection runs in `light:sel` (+ `dark:sel` unless it selects unit tests only) — no shard builds just
#   to exit any more;
# - extras (dispatch input `extras`): the rest of the full CI in the same run on the same build(s) —
#   e2e (e2e-replay.yml, TernE2E products), proto (proto-loopback.yml: loopback + openconnect + masque-ip; or name
#   jobs: loopback, openconnect, masque-ip, masque-warp), ipa (ios.yml build_only), checks (checks.yml), all = e2e,proto,ipa,checks.
#   Full CI = astemo6: shard=full extras=e2e,ipa,checks  +  astemo666 mirror: shard=full extras=proto[,masque-warp].
#
# Org mirror sharding (doubles concurrent macOS runners; free plan = 5 macOS jobs per account/org):
#   astemo6/mihomo-ios   → ui zh-Hans (light + dark) + unit
#   astemo666/mihomo-ios → ui en (light + dark)
#   any other repo       → everything
# Full matrix in one repo: workflow_dispatch shard=all, or [shard:all] in the pushed commit message.
# scripts/selftest-split.sh pushes a test/** branch to both remotes and waits for both runs.
# Lane F (2026-10-24, docs in CI.md):
# - a newer push to the same test/** branch cancels the older run (concurrency below);
# - a push whose commit already has a Self-test run on another branch of this repository (queued, running or
#   successful) skips ui (dedupe job) — a re-run of the skipped run, or a workflow_dispatch, always runs;
#
# UI path (2026-10-24, maintainer rule: a release that touches no UI and no copy runs the smoke shard + unit
# tests + the IPA build only):
#   The plan job diffs HEAD against its base and classifies every changed file.
#     base = merge-base(HEAD, origin/main) for test/** pushes and dispatches on a branch (the whole branch,
#            not just the pushed commit). When that is HEAD itself (dispatch on main, or a test/** branch
#            sitting on main = the release path) the base is the newest release tag v*-build* below HEAD.
#            No base found → full.
#   UI-affecting files (any one → full matrix as before):
#     App/**            views, view models, Assets.xcassets, Localizable.xcstrings, Info.plist, Resources
#     Shared/**         compiled into the app + widget; holds String(localized:) copy and LiveActivityViews
#     Widget/**         widget / Live Activity UI
#     UITests/**        the UI tests themselves
#     project-uitests.yml  UI / unit test targets and scheme
#     *.xcstrings *.strings *.stringsdict *.lproj/** *.xcassets/** *.storyboard *.xib  anywhere
#     project.yml       only when a changed line mentions the app/widget UI: a path App/Shared/Widget,
#                       xcstrings, ASSETCATALOG, INFOPLIST, PRODUCT_NAME, AppIcon, AccentColor, DisplayName
#   Everything else (PacketTunnel/**, Geo/**, Config/**, UnitTests/**, scripts/**, .github/**,
#   docs) is not UI-affecting → smoke.
#   smoke = zh-Hans light SMOKE_TESTS (launch + tab/page navigation + node manager) + the `unit` combo
#     (astemo6 / other repos; the astemo666 en mirror runs no UI job). The app, test bundle and framework are built
#     in full, so a compile break still fails.
#   full  = the repository split above: jobs 1…N per language (+ unit on astemo6 / other repos).
# Markers / inputs (commit message of the pushed head; dispatch input `shard`):
#   [shard:all]   / shard=all    full matrix, both languages, in this repo (wins over everything)
#   [shard:smoke] / shard=smoke  force smoke even when UI files changed
#   [shard:full]  / shard=full   force the full repository-split matrix even when no UI file changed
#   (none)        / shard=auto   the diff rule above
#   [only:<test>] / [unit:<Class>] / inputs.only  explicit selection: light:sel + dark:sel of the repository's
#                 language (both languages with shard=all; only light:sel when the selection is unit tests only, or
#                 with [shard:smoke] / shard=smoke)
#   [skip-ui]  unchanged.
name: Self-test

on:
  push:
    branches: ['test/**']
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the self-tests
        type: boolean
        required: false
        default: true
      only:
        description: "Optional -only-testing filter, e.g. TernUITests/TernUITests/test04_NodeManager"
        type: string
        required: false
        default: ""
      shard:
        description: "auto = smoke if no UI-affecting file changed (see header), else split by repository; full = split by repository; smoke = one zh-Hans light smoke combo + unit; all = full matrix here"
        type: choice
        options: [auto, full, smoke, all]
        required: false
        default: auto
      extras:
        description: "Also run on the same build(s): comma list of e2e, proto, loopback, openconnect, masque-ip, masque-warp, ipa, checks; all = e2e,proto,ipa,checks"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Commit / ref to test (empty = the triggering commit)
        type: string
        required: false
        default: ""
      run_tests:
        type: boolean
        required: false
        default: true
      only:
        type: string
        required: false
        default: ""
      shard:
        description: "auto | full | smoke | all (see header)"
        type: string
        required: false
        default: auto
      extras:
        type: string
        required: false
        default: ""
    secrets:
      TERN_E2E_KEY:
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: selftest-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Identical-SHA dedupe (push only): the same commit pushed to a second test/** branch while its first run is
  # queued / running / green would take the macOS runners again for the same result.
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.find.outputs.skip }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.run_attempt }}" = 1 ]; then
            # Earlier runs (lower id) of this workflow for the same commit on another branch that are not
            # cancelled / failed. Any API error leaves SKIP=false (never skip by accident).
            OTHER=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ui-tests.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=50" \
              --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID and .head_branch != env.BRANCH and (.status != \"completed\" or .conclusion == \"success\")) | \"\(.id) \(.head_branch) \(.status)/\(.conclusion)\"" 2>/dev/null | head -n 1 || true)
            if [ -n "$OTHER" ]; then
              SKIP=true
              read -r OID OBR OST <<< "$OTHER"
              echo "### Self-test skipped: commit ${GITHUB_SHA::7} already has run $OID on $OBR ($OST)" >> "$GITHUB_STEP_SUMMARY"
              echo "- $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$OID — re-run this run to test it here anyway" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "skip=$SKIP" | tee -a "$GITHUB_OUTPUT"
  plan:
    # Picks the UI path (smoke / full / selection) and the combos, decides which builds the run needs, parses extras.
    needs: dedupe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      combos: ${{ steps.plan.outputs.combos }}
      mode: ${{ steps.plan.outputs.mode }}
      ui: ${{ steps.plan.outputs.ui }}
      unit: ${{ steps.plan.outputs.unit }}
      build_ui: ${{ steps.plan.outputs.build_ui }}
      build_e2e: ${{ steps.plan.outputs.build_e2e }}
      e2e: ${{ steps.plan.outputs.e2e }}
      loop_jobs: ${{ steps.plan.outputs.loop_jobs }}
      ipa: ${{ steps.plan.outputs.ipa }}
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # Whole history without blobs: enough for merge-base / tags / name-only diffs (blobs fetched on demand).
          fetch-depth: 0
          filter: blob:none
      - name: Plan
        id: plan
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHARD_INPUT: ${{ inputs.shard }}
          ONLY_INPUT: ${{ inputs.only }}
          EXTRAS: ${{ inputs.extras }}
          REPO: ${{ github.repository }}
          DEDUPE_SKIP: ${{ needs.dedupe.outputs.skip }}
          RUN_UI: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-ui]')) || inputs.run_tests }}
        run: |
          set -uo pipefail
          FORCE=""
          case "${SHARD_INPUT:-}" in all|smoke|full) FORCE="$SHARD_INPUT" ;; esac
          if [ -z "$FORCE" ]; then
            if printf '%s' "$COMMIT_MSG" | grep -qF '[shard:all]'; then FORCE=all
            elif printf '%s' "$COMMIT_MSG" | grep -qF '[shard:smoke]'; then FORCE=smoke
            elif printf '%s' "$COMMIT_MSG" | grep -qF '[shard:full]'; then FORCE=full
            fi
          fi
          SELECTION=0
          if [ -n "${ONLY_INPUT:-}" ] || printf '%s' "$COMMIT_MSG" | grep -qE '\[(only|unit):[A-Za-z0-9_]+\]'; then SELECTION=1; fi
          BASE=""; BASE_DESC=""; UI_FILES=""; NCHANGED=0
          if [ -n "$FORCE" ]; then
            MODE=$FORCE; REASON="forced ($FORCE)"
          elif [ "$SELECTION" = 1 ]; then
            MODE=selection; REASON="explicit [only:]/[unit:] selection"
          else
            MB=$(git merge-base HEAD origin/main 2>/dev/null || true)
            HEADSHA=$(git rev-parse HEAD)
            if [ -n "$MB" ] && [ "$MB" != "$HEADSHA" ]; then
              BASE=$MB; BASE_DESC="merge-base with origin/main"
            else
              TAG=$(git describe --tags --abbrev=0 --match 'v*-build*' HEAD 2>/dev/null || true)
              if [ -n "$TAG" ]; then BASE=$(git rev-list -n1 "$TAG"); BASE_DESC="last release tag $TAG"; fi
            fi
            if [ -z "$BASE" ]; then
              MODE=full; REASON="no diff base found"
            elif ! CHANGED=$(git diff --name-only "$BASE" HEAD); then
              MODE=full; REASON="git diff failed"
            else
              NCHANGED=$(printf '%s\n' "$CHANGED" | grep -c . || true)
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                ui=0
                case "$f" in
                  App/*|Shared/*|Widget/*|UITests/*|project-uitests.yml) ui=1 ;;
                  *.xcstrings|*.strings|*.stringsdict|*.storyboard|*.xib|*.lproj/*|*.xcassets/*) ui=1 ;;
                  project.yml)
                    if git diff "$BASE" HEAD -- project.yml | grep -E '^[+-][^+-]' \
                      | grep -qE 'path: *(App|Shared|Widget)|xcstrings|ASSETCATALOG|INFOPLIST|PRODUCT_NAME|AppIcon|AccentColor|DisplayName'; then ui=1; fi ;;
                esac
                [ "$ui" = 1 ] && UI_FILES="$UI_FILES$f"$'\n'
              done <<< "$CHANGED"
              if [ -n "$UI_FILES" ]; then MODE=full; REASON="UI-affecting files changed"; else MODE=smoke; REASON="no UI-affecting file changed"; fi
            fi
          fi
          # Combos: "<lang>:K/N" (full-matrix job), "<lang>:light:smoke", "<lang>:light:sel" / "<lang>:dark:sel"; "unit" is
          # taken out below and runs in the unit job.
          # Full-matrix jobs per language: "<lang>:K/N" = shard K of N of the light tests plus the dark-appearance checks
          # (scripts/ci/ui-shards.py balances them on measured durations). N = 4 when the repository's 5 runners also
          # carry other jobs of this run (astemo6: the unit combo, E2E, the IPA build; the mirror with proto-loopback
          # extras), so the 4 UI jobs and the rest fill 5 runners at once; 5 otherwise and for shard=all.
          jobs_for() { local n=$1 k out=""; for k in $(seq 1 "$n"); do out="$out,\"LANG:$k/$n\""; done; echo "${out#,}"; }
          NZH=4; NEN=5
          case ",${EXTRAS:-}," in *,proto,*|*,loopback,*|*,openconnect,*|*,masque-ip,*|*,masque-warp,*|*,all,*) NEN=4 ;; esac
          [ "$MODE" != all ] || { NZH=5; NEN=5; }
          ZH=$(jobs_for "$NZH"); ZH=${ZH//LANG/zh-Hans}; EN=$(jobs_for "$NEN"); EN=${EN//LANG/en}
          # Unit-only selection ([unit:] markers without [only:], or inputs.only naming TernUnitTests): no dark run.
          UNIT_ONLY=0
          if [ "$SELECTION" = 1 ]; then
            UNIT_ONLY=1
            [ -z "${ONLY_INPUT:-}" ] || case "$ONLY_INPUT" in TernUnitTests|TernUnitTests/*) ;; *) UNIT_ONLY=0 ;; esac
            if printf '%s' "$COMMIT_MSG" | grep -qE '\[only:[A-Za-z0-9_]+\]'; then UNIT_ONLY=0; fi
          fi
          sel() { # lang list → selection combos
            local out="" l
            for l in "$@"; do
              out="$out,\"$l:light:sel\""
              [ "$UNIT_ONLY" = 1 ] || out="$out,\"$l:dark:sel\""
            done
            echo "[${out#,}]"
          }
          case "$REPO" in astemo666/mihomo-ios) MYLANG=en ;; astemo6/mihomo-ios) MYLANG=zh-Hans ;; *) MYLANG="zh-Hans en" ;; esac
          if [ "$SELECTION" = 1 ]; then
            case "$MODE" in
              smoke) if [ "$REPO" = astemo666/mihomo-ios ]; then COMBOS='[]'; else COMBOS='["zh-Hans:light:sel"]'; fi ;;
              all) COMBOS=$(sel zh-Hans en) ;;
              *) COMBOS=$(sel $MYLANG) ;;
            esac
          else
            case "$MODE" in
              all) COMBOS="[$ZH,$EN,\"unit\"]" ;;
              smoke) if [ "$REPO" = astemo666/mihomo-ios ]; then COMBOS='[]'; else COMBOS='["zh-Hans:light:smoke","unit"]'; fi ;;
              *) case "$REPO" in
                   astemo666/mihomo-ios) COMBOS="[$EN]" ;;
                   astemo6/mihomo-ios) COMBOS="[$ZH,\"unit\"]" ;;
                   *) COMBOS="[$ZH,$EN,\"unit\"]" ;;
                 esac ;;
            esac
          fi
          # The unit combo runs in its own job (`unit`, queued after the IPA build when the run has one).
          UNIT=false
          case "$COMBOS" in *'"unit"'*) UNIT=true; COMBOS=$(printf '%s' "$COMBOS" | sed -e 's/,"unit"//' -e 's/"unit",//' -e 's/"unit"//') ;; esac
          UI=false
          if [ "$DEDUPE_SKIP" != true ] && [ "$RUN_UI" = true ] && [ "$COMBOS" != '[]' ]; then UI=true; fi
          if [ "$DEDUPE_SKIP" = true ] || [ "$RUN_UI" != true ]; then UNIT=false; fi
          # Extras (dispatch / call input): the rest of the full CI on the same build(s).
          E2E=false; IPA=false; CHK=false; LOOP=""
          for x in $(printf '%s' "${EXTRAS:-}" | tr ',' ' '); do
            case "$x" in
              all) E2E=true; IPA=true; CHK=true; LOOP="$LOOP,loopback,openconnect,masque-ip" ;;
              e2e) E2E=true ;;
              ipa) IPA=true ;;
              checks) CHK=true ;;
              proto) LOOP="$LOOP,loopback,openconnect,masque-ip" ;;
              loopback|openconnect|masque-ip|masque-warp) LOOP="$LOOP,$x" ;;
              *) echo "::error::unknown extras entry '$x'"; exit 1 ;;
            esac
          done
          LOOP=$(printf '%s' "$LOOP" | tr ',' '\n' | grep . | sort -u | paste -sd, - || true)
          BUILD_UI=$UI; BUILD_E2E=$E2E
          [ "$UNIT" != true ] || BUILD_UI=true
          case ",$LOOP," in *,loopback,*) BUILD_UI=true ;; esac
          case ",$LOOP," in *,openconnect,*|*,masque-ip,*|*,masque-warp,*) BUILD_E2E=true ;; esac
          echo "mode=$MODE ($REASON) base=${BASE:-none} ${BASE_DESC} changed=$NCHANGED combos=$COMBOS ui=$UI unit=$UNIT extras: e2e=$E2E loop=$LOOP ipa=$IPA checks=$CHK"
          {
            echo "mode=$MODE"; echo "combos=$COMBOS"; echo "ui=$UI"; echo "unit=$UNIT"; echo "build_ui=$BUILD_UI"; echo "build_e2e=$BUILD_E2E"
            echo "e2e=$E2E"; echo "loop_jobs=$LOOP"; echo "ipa=$IPA"; echo "checks=$CHK"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### UI path: $MODE"
            echo "- reason: $REASON"
            [ -n "$BASE" ] && echo "- base: \`${BASE:0:12}\` ($BASE_DESC), $NCHANGED changed file(s)"
            echo "- combos: \`$COMBOS\` (ui runs: $UI), unit job: $UNIT"
            [ -z "${EXTRAS:-}" ] || echo "- extras: e2e=$E2E proto-loopback=[${LOOP}] ipa=$IPA checks=$CHK"
            case "$COMBOS" in *zh-Hans:1/*) echo "- zh-Hans jobs:"; python3 scripts/ci/ui-shards.py "$NZH" | sed 's/^/  /' ;; esac
            case "$COMBOS" in *en:1/*) echo "- en jobs:"; python3 scripts/ci/ui-shards.py "$NEN" | sed 's/^/  /' ;; esac
            if [ -n "$UI_FILES" ]; then
              echo "- UI-affecting files:"
              printf '%s' "$UI_FILES" | head -n 30 | sed 's/^/  - /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-ui:
    needs: plan
    if: needs.plan.outputs.build_ui == 'true'
    uses: ./.github/workflows/build-for-testing.yml
    with:
      ref: ${{ inputs.ref }}
      scheme: TernUITests

  build-e2e:
    needs: plan
    if: needs.plan.outputs.build_e2e == 'true'
    uses: ./.github/workflows/build-for-testing.yml
    with:
      ref: ${{ inputs.ref }}
      scheme: TernE2E

  ui:
    # [skip-ui] in the pushed commit message: the macOS UI shards are not run (plan output ui=false).
    # The plan job's combos are [] when nothing runs here (smoke on the astemo666 en mirror).
    needs: [plan, build-ui]
    if: needs.plan.outputs.ui == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # free plan: 5 macOS jobs per account; listed longest first so the long light shards start first.
      max-parallel: 5
      matrix:
        combo: ${{ fromJSON(needs.plan.outputs.combos) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Combo
        run: |
          combo="${{ matrix.combo }}"
          if true; then
            LANG_=${combo%%:*}; rest=${combo#*:}
            L2=$([ "$LANG_" = zh-Hans ] && echo zh || echo "$LANG_")
            case "$rest" in
              */*) STYLE=light; SHARD=$rest; SHORT=$L2-${rest%/*} ;;                    # full matrix job K/N
              *) STYLE=${rest%%:*}; SHARD=${rest#*:}; SHORT=$L2-$STYLE-$SHARD ;;         # light:smoke / light:sel / dark:sel
            esac
          fi
          { echo "LANG_=$LANG_"; echo "STYLE=$STYLE"; echo "SHARD=$SHARD"; echo "SHORT=$SHORT"; } >> "$GITHUB_ENV"
      - uses: ./.github/actions/tern-prebuilt
        with:
          scheme: TernUITests
          xcode: ${{ needs.build-ui.outputs.xcode }}
      - name: Run tests
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ONLY_INPUT: ${{ inputs.only }}
          SMOKE_TESTS: test01_TabsAndHome test03_MoreEveryPage test04_NodeManager
        run: |
          set +e
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          mkdir -p shots results
          SEL=(); DARK_SEL=()
          case "$SHARD" in
            sel)
              # Explicit selection ([only:] / [unit:] markers, inputs.only).
              if [ -n "$ONLY_INPUT" ]; then SEL=(-only-testing:"$ONLY_INPUT"); fi
              for t in $(printf '%s' "$COMMIT_MSG" | grep -oE '\[only:[A-Za-z0-9_]+\]' | sed -E 's/\[only:(.*)\]/\1/'); do
                SEL+=(-only-testing:"TernUITests/TernUITests/$t")
              done
              for t in $(printf '%s' "$COMMIT_MSG" | grep -oE '\[unit:[A-Za-z0-9_]+\]' | sed -E 's/\[unit:(.*)\]/\1/'); do
                SEL+=(-only-testing:"TernUnitTests/$t")
              done
              if [ ${#SEL[@]} -eq 0 ]; then echo "::error::selection combo without a selection"; exit 1; fi ;;
            smoke) for t in $SMOKE_TESTS; do SEL+=(-only-testing:"TernUITests/TernUITests/$t"); done ;;
            */*)
              # Full-matrix job K/N (scripts/ci/ui-shards.py): its light tests, then its dark-appearance checks.
              while read -r kind arg; do
                if [ "$kind" = dark ]; then DARK_SEL+=("$arg"); else SEL+=("$arg"); fi
              done < <(python3 scripts/ci/ui-shards.py "${SHARD#*/}" "${SHARD%/*}")
              echo "job $SHARD: ${#SEL[@]} light / ${#DARK_SEL[@]} dark selection argument(s)" ;;
            *) echo "::error::unknown shard $SHARD"; exit 1 ;;
          esac
          FAILED=""
          run_pass() { # style tag args… — one xcodebuild test-without-building pass in that appearance
            local style=$1 tag=$2; shift 2
            xcrun simctl ui "$DEV" appearance "$style" || true
            # feat/jsc-engine: JavaScriptCore without JIT in the test host, as on a device (no JIT for apps and
            # extensions). Round 2 (8e86e33): with JIT the busy-loop case was never terminated by the time limit.
            TEST_RUNNER_UI_LANG="$LANG_" TEST_RUNNER_UI_STYLE="$style" TEST_RUNNER_UI_SHOT_DIR="$PWD/shots" TEST_RUNNER_JSC_useJIT=false \
            xcodebuild -xctestrun "$XCTESTRUN" -destination "id=$DEV" -resultBundlePath "results/$tag.xcresult" \
              "$@" test-without-building 2>&1 | tee "results/$tag.log" | grep -E "Test Case|error:|failed|passed|XCTAssert|issue|Executed"
            local rc=${PIPESTATUS[0]}
            # review 5 P2-10: grep reads to EOF (no `| head`), so SIGPIPE can no longer end the test run early.
            echo "$tag exit $rc"
            [ "$rc" = 0 ] || { tail -n 120 "results/$tag.log"; FAILED="$FAILED $tag"; }
            echo "- $tag: passed $(grep -cE "^Test Case .* passed" "results/$tag.log"), failed $(grep -cE "^Test Case .* failed" "results/$tag.log"), skipped $(grep -cE "^Test Case .* skipped" "results/$tag.log")" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "### Self-test $SHORT" >> "$GITHUB_STEP_SUMMARY"
          [ ${#SEL[@]} -eq 0 ] || run_pass "$STYLE" "$SHORT" "${SEL[@]}"
          [ ${#DARK_SEL[@]} -eq 0 ] || run_pass dark "$SHORT-dark" "${DARK_SEL[@]}"
          {
            for f in shots/*/report-*.md; do
              [ -f "$f" ] || continue
              n=$(sed -n '/^## issues/,/^## warnings/p' "$f" | grep -c '^\[' || true)
              echo "- $(basename "$(dirname "$f")") $(basename "$f" .md): $n issue(s)"
            done
            echo "- failed:${FAILED:- none}"
          } >> "$GITHUB_STEP_SUMMARY"
          cat shots/*/report-*.md 2>/dev/null | grep -E "^\[|^# " | head -n 400
          echo "FAILED=$FAILED" >> "$GITHUB_ENV"
      - name: Crash logs
        if: always()
        run: |
          mkdir -p crashes
          cp ~/Library/Logs/DiagnosticReports/Tern* crashes/ 2>/dev/null || true
          [ -z "${DEV:-}" ] || find "$HOME/Library/Developer/CoreSimulator/Devices/$DEV" -name "Tern*.ips" -exec cp {} crashes/ \; 2>/dev/null || true
          ls -la crashes
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-screens-${{ env.SHORT }}
          path: |
            shots/
            crashes/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-results-${{ env.SHORT }}
          path: results/*.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-xcresult-${{ env.SHORT }}
          path: results/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Result
        run: |
          if [ -n "$FAILED" ]; then echo "UI tests failed:$FAILED"; exit 1; fi

  unit:
    # The whole TernUnitTests bundle once per run (smoke and full paths). Queued after the IPA build when this run has
    # one, so it takes that runner instead of a UI job's (the UI jobs are the critical path).
    needs: [plan, build-ui, ipa]
    if: ${{ !cancelled() && needs.plan.outputs.unit == 'true' && needs.build-ui.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/tern-prebuilt
        with:
          scheme: TernUITests
          xcode: ${{ needs.build-ui.outputs.xcode }}
      - name: Run unit tests
        run: |
          set +e
          xcrun simctl bootstatus "$DEV" -b
          mkdir -p shots results
          # Same JSC setting as a device (no JIT); LiveActivityLayoutTests writes its PNGs to UI_SHOT_DIR.
          TEST_RUNNER_UI_SHOT_DIR="$PWD/shots" TEST_RUNNER_JSC_useJIT=false \
          xcodebuild -xctestrun "$XCTESTRUN" -destination "id=$DEV" -resultBundlePath results/unit.xcresult \
            -only-testing:TernUnitTests test-without-building 2>&1 | tee results/unit.log \
            | grep -E "Test Case .*(failed|passed)|error:|XCTAssert|Executed"
          RC=${PIPESTATUS[0]}
          [ "$RC" = 0 ] || tail -n 150 results/unit.log
          {
            echo "### Unit tests"
            echo "- passed $(grep -cE "^Test Case .* passed" results/unit.log), failed $(grep -cE "^Test Case .* failed" results/unit.log), skipped $(grep -cE "^Test Case .* skipped" results/unit.log)"
            grep -E "Executed [0-9]+ tests?" results/unit.log | tail -n 1 | sed 's/^/- /'
            echo "- exit $RC"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-screens-unit
          path: shots/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-results-unit
          path: results/unit.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: ui-xcresult-unit
          path: results/unit.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Extras: the rest of the full CI in this run, on the builds above.
  e2e:
    # Queued after the IPA build (when this run has one) so it takes that runner instead of a UI job's.
    needs: [plan, build-e2e, ipa]
    if: ${{ !cancelled() && needs.plan.outputs.e2e == 'true' && needs.build-e2e.result == 'success' }}
    uses: ./.github/workflows/e2e-replay.yml
    with:
      ref: ${{ inputs.ref }}
      fixture: auto
      prebuilt: true
      xcode: ${{ needs.build-e2e.outputs.xcode }}
    secrets: inherit

  proto-loopback:
    needs: [plan, build-ui, build-e2e]
    if: ${{ !cancelled() && needs.plan.outputs.loop_jobs != '' && needs.build-ui.result != 'failure' && needs.build-e2e.result != 'failure' }}
    uses: ./.github/workflows/proto-loopback.yml
    with:
      ref: ${{ inputs.ref }}
      jobs: ${{ needs.plan.outputs.loop_jobs }}
      prebuilt: true
      xcode_ui: ${{ needs.build-ui.outputs.xcode }}
      xcode_e2e: ${{ needs.build-e2e.outputs.xcode }}

  ipa:
    needs: plan
    if: needs.plan.outputs.ipa == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/ios.yml
    with:
      ref: ${{ inputs.ref }}
      build_only: true

  checks:
    needs: plan
    if: needs.plan.outputs.checks == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ inputs.ref }}
