name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  term-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/term_audit.py

  goja-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: bash scripts/goja_diff_check.sh
