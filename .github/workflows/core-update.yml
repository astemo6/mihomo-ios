# 每天检查 MetaCubeX/mihomo 的最新正式版；有新版本时：
#   1) 在分支 core/mihomo-<tag> 上升级 bridge/go.mod 并提交 "core: mihomo <tag>"（go vet + go test 先过）
#   2) 对这个提交跑完整 CI（F 线 2026-10-24）：Checks（checks.yml）+ Self-test（ui-tests.yml：Go vet/test/-race
#      + 本仓库的 UI 分片），全绿后再调用 ios.yml 做 build_only 构建（不发布）
#   3) 全部通过 → candidate 作业把 IPA 打包成发版候选 artifact「core-candidate-<tag>」（manifest.json + SHA256SUMS），
#      并开 PR（core/mihomo-<tag> → 默认分支）。
#      发布必须由维护者明确批准：手动运行「Core release (manual)」（core-release.yml，填本次 run id 和 tag），
#      它只把候选 IPA 发成 GitHub prerelease，tag 指向 core 分支上的提交。
#      绝不直接推送默认分支、绝不自动发布（默认分支上常有用 [skip ci] 合并、尚未测试的改动）。
#      无法开 PR（仓库未允许 Actions 建 PR）时改为开 issue。失败 → 开 issue，默认分支保持不变
# 修好分支后重测：workflow_dispatch，tag=<该版本>，rebuild=true（不重新升级，直接对分支当前提交跑上面 2)–3)）。
# 注意：GITHUB_TOKEN 推送的分支不会触发其它 workflow，所以 CI 由本 workflow 以 workflow_call 调用。说明见 CI.md。
# 内核版本只记录在 bridge/go.mod（ios.yml 从 go.mod 读取），因此这里不需要改 workflow 文件
# （GITHUB_TOKEN 没有修改 .github/workflows 的权限）。
name: Core auto-update

on:
  schedule:
    - cron: "0 2 * * *"   # 每天 02:00 UTC（北京时间 10:00）
  workflow_dispatch:
    inputs:
      tag:
        description: "指定 mihomo 版本（留空 = 最新正式版）"
        required: false
        default: ""
      rebuild:
        description: "分支 core/mihomo-<tag> 已存在时：直接对它当前的提交重跑 CI 并打包候选（不重新升级）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: core-update
  cancel-in-progress: false

jobs:
  check:
    # Never on the org mirror (astemo666/mihomo-ios).
    if: github.repository == 'astemo6/mihomo-ios'
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.bump.outputs.updated }}
      tag: ${{ steps.latest.outputs.tag }}
      branch: ${{ steps.bump.outputs.branch }}
      sha: ${{ steps.bump.outputs.sha }}
      build: ${{ steps.build.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Latest mihomo release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${WANT:-}" ]; then
            TAG="$WANT"
          else
            # /releases/latest 已排除 prerelease 与 draft（如 Prerelease-Alpha）
            TAG=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq .tag_name)
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected tag '$TAG', skipping"; TAG=""
          fi
          CUR=$(awk '$1=="github.com/metacubex/mihomo"{print $2; exit}' bridge/go.mod)
          echo "current=$CUR latest=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "current=$CUR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        if: steps.latest.outputs.tag != ''
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Bump on a branch
        id: bump
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          CUR: ${{ steps.latest.outputs.current }}
          REBUILD: ${{ inputs.rebuild && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ] || [ "$TAG" = "$CUR" ] || [ "$(printf '%s\n%s\n' "$CUR" "$TAG" | sort -V | tail -n1)" != "$TAG" ]; then
            echo "Core is up to date ($CUR)."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BR="core/mihomo-$TAG"
          EXISTS=0
          git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1 && EXISTS=1
          # Review 6 R6A-5: an existing branch means this tag was already proposed (open PR) or failed (open issue
          # says to fix it there or delete the branch to retry) — never re-bump, re-build and re-comment every day.
          # Lane F: a manual run with rebuild=true tests the branch as it is now (e.g. after a fix was pushed there).
          if [ "$EXISTS" = 1 ] && [ "$REBUILD" != true ]; then
            echo "Branch $BR already exists; delete it to retry, or run with rebuild=true."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "### mihomo $TAG：分支 $BR 已存在，跳过（删除该分支可重试，或手动运行并勾选 rebuild 重测该分支）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Written before go vet / go test so a failure below is still reported (report-failure).
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          if [ "$EXISTS" = 1 ]; then
            git fetch origin "refs/heads/$BR"
            git checkout -B "$BR" FETCH_HEAD
          else
            git checkout -B "$BR"
          fi
          cd bridge
          if [ "$EXISTS" = 0 ]; then
            go get "github.com/metacubex/mihomo@$TAG"
            go mod tidy
          fi
          go vet -tags with_gvisor ./...
          # r7 (review7 R7A-13): like Self-test, failing tests get one retry on their own (several download geo data /
          # reach public endpoints and flake on the runner's network) before a 「升级失败」 issue is opened.
          set +e
          go test -tags with_gvisor -count=1 ./... 2>&1 | tee ../go-test.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" != 0 ]; then
            FAILED=$(grep -E "^--- FAIL: " ../go-test.log | awk '{print $3}' | sort -u | paste -sd'|' -)
            echo "failed first run: $FAILED"
            [ -n "$FAILED" ] || exit "$RC"
            go test -tags with_gvisor -count=1 -run "^(${FAILED})\$" ./... 2>&1 | tee ../go-test-retry.log
            RC=${PIPESTATUS[0]}
            echo "- go test retry (${FAILED//|/, }): exit $RC" >> "$GITHUB_STEP_SUMMARY"
            [ "$RC" = 0 ] || exit "$RC"
          fi
          set -e
          rm -f ../go-test.log ../go-test-retry.log
          cd ..
          if [ "$EXISTS" = 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bridge/go.mod bridge/go.sum
            git commit -m "core: mihomo $TAG"
            git push -f origin "$BR"
            echo "### mihomo $CUR → $TAG（分支 $BR）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### mihomo $TAG：重测已有分支 $BR（$(git rev-parse --short HEAD)）" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Every later job (Checks, Self-test, build, candidate) tests this exact commit, not the moving branch.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      # The candidate's CFBundleVersion: "<last iOS IPA run number>.<this run number>" (e.g. 297.12) sorts after the
      # last release build and before the next one; a called ios.yml would otherwise use THIS run's small number.
      - name: Candidate build number
        id: build
        if: steps.bump.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?per_page=1" --jq '.workflow_runs[0].run_number')
          echo "$LAST" | grep -Eq '^[0-9]+$'
          echo "build=${LAST}.${GITHUB_RUN_NUMBER}" | tee -a "$GITHUB_OUTPUT"

  # ---- CI on the bumped commit (Lane F). A push by GITHUB_TOKEN triggers no workflow, so they are called here. ----
  checks:
    needs: check
    if: github.repository == 'astemo6/mihomo-ios' && needs.check.outputs.updated == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.check.outputs.sha }}

  # Go vet / go test / go test -race + the UI shards this repository runs (shard auto: zh-Hans light 1–3 + dark;
  # en runs on the org mirror only, never [shard:all]).
  selftest:
    needs: check
    if: github.repository == 'astemo6/mihomo-ios' && needs.check.outputs.updated == 'true'
    uses: ./.github/workflows/ui-tests.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
      run_tests: true
      shard: auto

  # Built only once Checks and Self-test are green (the macOS runner is not taken for a commit that already failed).
  # Signed with the repository's signing secrets when they are set (EXPORT_METHOD decides development / ad-hoc /
  # app-store); otherwise the usual unsigned -widget / -sharedcore IPAs. Never publishes (build_only).
  test-build:
    needs: [check, checks, selftest]
    if: github.repository == 'astemo6/mihomo-ios' && needs.check.outputs.updated == 'true'
    uses: ./.github/workflows/ios.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
      build_only: true
      build_number: ${{ needs.check.outputs.build }}
    secrets: inherit

  # All green → the release candidate: the build's IPA(s) + entitlements, manifest.json and SHA256SUMS in one
  # artifact. Publishing it is a separate, manual workflow (core-release.yml) — nothing here releases or touches main.
  candidate:
    needs: [check, checks, selftest, test-build]
    if: github.repository == 'astemo6/mihomo-ios' && needs.check.outputs.updated == 'true' && needs.checks.result == 'success' && needs.selftest.result == 'success' && needs.test-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ needs.check.outputs.tag }}
      BR: ${{ needs.check.outputs.branch }}
      SHA: ${{ needs.check.outputs.sha }}
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Mihomo-ipa
          path: candidate
      - name: Manifest
        run: |
          set -euo pipefail
          cd candidate
          ls -la
          ls ./*.ipa >/dev/null
          sha256sum -- * > SHA256SUMS
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          SIGNED=false; ls ./*-signed.ipa >/dev/null 2>&1 && SIGNED=true
          jq -nR --arg tag "$TAG" --arg branch "$BR" --arg sha "$SHA" --arg build "$BUILD" --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$RUN_URL" --argjson signed "$SIGNED" \
            '{mihomo: $tag, branch: $branch, sha: $sha, build: $build, run_id: $run_id, run_url: $run_url, signed: $signed,
              files: [inputs | split("  ") | {sha256: .[0], name: .[1]}]}' < SHA256SUMS > manifest.json
          cat manifest.json
          {
            echo "### 发版候选：mihomo $TAG（构建 $BUILD，提交 ${SHA::7}）"
            echo "- Checks、Self-test（Go -race + UI）、build_only 全部通过；artifact \`core-candidate-$TAG\`（保留 30 天）"
            echo "- 已签名：$SIGNED"
            echo "- **尚未发布。** 维护者批准后运行 Actions → Core release (manual)：run_id=\`$GITHUB_RUN_ID\`，confirm=\`$TAG\`"
            echo "  （命令行：\`gh workflow run core-release.yml -R $GITHUB_REPOSITORY -f run_id=$GITHUB_RUN_ID -f confirm=$TAG\`）"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: core-candidate-${{ needs.check.outputs.tag }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30

  promote:
    needs: [check, candidate]
    if: github.repository == 'astemo6/mihomo-ios' && needs.check.outputs.updated == 'true' && needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      BR: ${{ needs.check.outputs.branch }}
      TAG: ${{ needs.check.outputs.tag }}
      SHA: ${{ needs.check.outputs.sha }}
      BUILD: ${{ needs.check.outputs.build }}
      DEFAULT: ${{ github.event.repository.default_branch }}
    steps:
      - name: Open pull request (never push or release main)
        run: |
          set -euo pipefail
          TITLE="core: mihomo $TAG"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY=$(printf '自动升级 mihomo 到 %s（提交 %s）。Checks、Self-test（Go -race + UI）、测试构建（build_only）全部通过：%s\n\n发版候选 artifact `core-candidate-%s`（构建 %s，保留 30 天）已就绪，**尚未发布**。\n\n- 批准发布候选：Actions → Core release (manual)，run_id=`%s`，confirm=`%s`；或 `gh workflow run core-release.yml -R %s -f run_id=%s -f confirm=%s`。只发 GitHub prerelease，不动默认分支。\n- 合并本 PR 到默认分支会触发正常的发版构建；若候选已发布、不想再发一版，合并提交信息里带 [skip ci]。\n\n本 workflow 不会推送默认分支，也不会自动发布 IPA。' "$TAG" "${SHA::7}" "$RUN_URL" "$TAG" "$BUILD" "$GITHUB_RUN_ID" "$TAG" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$TAG")
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BR" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh pr comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "PR #$EXISTING 已更新" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT" --head "$BR" --title "$TITLE" --body "$BODY"; then
            echo "已开 PR：$BR → $DEFAULT（未合并、未发布）" >> "$GITHUB_STEP_SUMMARY"
          else
            ITITLE="内核可升级：mihomo $TAG"
            IBODY=$(printf '%s\n\n分支 `%s` 已就绪，但 Actions 无法开 PR，请手动开 PR 合并。' "$BODY" "$BR")
            IEX=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$ITITLE in:title" --json number --jq '.[0].number' || true)
            if [ -n "$IEX" ]; then gh issue comment "$IEX" --repo "$GITHUB_REPOSITORY" --body "$IBODY"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$ITITLE" --body "$IBODY"; fi
            echo "无法开 PR，已开 issue" >> "$GITHUB_STEP_SUMMARY"
          fi

  report-failure:
    needs: [check, checks, selftest, test-build, candidate]
    # Review 6 R6A-4: also when the bump itself (go get / go vet / go test in `check`) failed — that left `updated`
    # unset and the failure went unreported. `branch` is written before those steps, so it marks a started bump.
    # Lane F: any of Checks / Self-test / build / candidate not green counts (a skipped build after a red Self-test too).
    if: always() && github.repository == 'astemo6/mihomo-ios' && ((needs.check.outputs.updated == 'true' && (needs.checks.result != 'success' || needs.selftest.result != 'success' || needs.test-build.result != 'success' || needs.candidate.result != 'success')) || (needs.check.result == 'failure' && needs.check.outputs.branch != ''))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      BR: ${{ needs.check.outputs.branch }}
      STAGE: ${{ needs.check.result == 'failure' && 'go vet / go test（新升级时分支尚未推送，次日会自动重试）' || (needs.checks.result != 'success' && 'Checks') || (needs.selftest.result != 'success' && 'Self-test（Go -race / UI）') || (needs.test-build.result != 'success' && '测试构建') || '打包候选' }}
    steps:
      - name: Open issue
        run: |
          TITLE="内核自动升级失败：mihomo $TAG"
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          BODY=$(printf '自动升级到 mihomo %s 后%s失败，默认分支未改动。\n\n- 分支：`%s`\n- 运行：%s\n\n修复后推送到该分支，再手动运行 Core auto-update（tag=%s，rebuild=true）重测；或删除分支后重新运行。' "$TAG" "$STAGE" "$BR" "$URL" "$TAG")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
