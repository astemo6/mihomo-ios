# 每天检查 MetaCubeX/mihomo 的最新正式版；有新版本时：
#   1) 在分支 core/mihomo-<tag> 上升级 bridge/go.mod 并提交 "core: mihomo <tag>"
#   2) 调用 ios.yml 在该分支上做一次完整测试构建（不发布）
#   3) 构建成功 → 开一个 PR（core/mihomo-<tag> → 默认分支），由人审核后合并；
#      绝不直接推送默认分支、绝不触发发布（默认分支上常有用 [skip ci] 合并、尚未测试的改动）。
#      无法开 PR（仓库未允许 Actions 建 PR）时改为开 issue。失败 → 开 issue，默认分支保持不变
# 内核版本只记录在 bridge/go.mod（ios.yml 从 go.mod 读取），因此这里不需要改 workflow 文件
# （GITHUB_TOKEN 没有修改 .github/workflows 的权限）。
name: Core auto-update

on:
  schedule:
    - cron: "0 2 * * *"   # 每天 02:00 UTC（北京时间 10:00）
  workflow_dispatch:
    inputs:
      tag:
        description: "指定 mihomo 版本（留空 = 最新正式版）"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: core-update
  cancel-in-progress: false

jobs:
  check:
    # Never on the org mirror (astemo666/mihomo-ios).
    if: github.repository == 'astemo6/mihomo-ios'
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.bump.outputs.updated }}
      tag: ${{ steps.latest.outputs.tag }}
      branch: ${{ steps.bump.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Latest mihomo release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${WANT:-}" ]; then
            TAG="$WANT"
          else
            # /releases/latest 已排除 prerelease 与 draft（如 Prerelease-Alpha）
            TAG=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq .tag_name)
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected tag '$TAG', skipping"; TAG=""
          fi
          CUR=$(awk '$1=="github.com/metacubex/mihomo"{print $2; exit}' bridge/go.mod)
          echo "current=$CUR latest=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "current=$CUR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.latest.outputs.tag != ''
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Bump on a branch
        id: bump
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          CUR: ${{ steps.latest.outputs.current }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ] || [ "$TAG" = "$CUR" ] || [ "$(printf '%s\n%s\n' "$CUR" "$TAG" | sort -V | tail -n1)" != "$TAG" ]; then
            echo "Core is up to date ($CUR)."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BR="core/mihomo-$TAG"
          # Review 6 R6A-5: an existing branch means this tag was already proposed (open PR) or failed (open issue
          # says to fix it there or delete the branch to retry) — never re-bump, re-build and re-comment every day.
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            echo "Branch $BR already exists; delete it to retry."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "### mihomo $TAG：分支 $BR 已存在，跳过（删除该分支可重试）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Written before go vet / go test so a failure below is still reported (report-failure).
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          git checkout -B "$BR"
          cd bridge
          go get "github.com/metacubex/mihomo@$TAG"
          go mod tidy
          go vet -tags with_gvisor ./...
          go test -tags with_gvisor ./...
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge/go.mod bridge/go.sum
          git commit -m "core: mihomo $TAG"
          git push -f origin "$BR"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "### mihomo $CUR → $TAG（分支 $BR）" >> "$GITHUB_STEP_SUMMARY"

  test-build:
    needs: check
    if: github.repository == 'astemo6/mihomo-ios' && needs.check.outputs.updated == 'true'
    uses: ./.github/workflows/ios.yml
    with:
      ref: ${{ needs.check.outputs.branch }}
      build_only: true
    secrets: inherit

  promote:
    needs: [check, test-build]
    if: github.repository == 'astemo6/mihomo-ios' && needs.check.outputs.updated == 'true' && needs.test-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      BR: ${{ needs.check.outputs.branch }}
      TAG: ${{ needs.check.outputs.tag }}
      DEFAULT: ${{ github.event.repository.default_branch }}
    steps:
      - name: Open pull request (never push or release main)
        run: |
          set -euo pipefail
          TITLE="core: mihomo $TAG"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY=$(printf '自动升级 mihomo 到 %s，测试构建（build_only）已通过：%s\n\n本 workflow 不会推送默认分支，也不会发布 IPA。请审核、跑自测后手动合并并发布。' "$TAG" "$RUN_URL")
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BR" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh pr comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "PR #$EXISTING 已更新" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT" --head "$BR" --title "$TITLE" --body "$BODY"; then
            echo "已开 PR：$BR → $DEFAULT（未合并、未发布）" >> "$GITHUB_STEP_SUMMARY"
          else
            ITITLE="内核可升级：mihomo $TAG"
            IBODY=$(printf '%s\n\n分支 `%s` 已就绪，但 Actions 无法开 PR，请手动开 PR 合并。' "$BODY" "$BR")
            IEX=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$ITITLE in:title" --json number --jq '.[0].number' || true)
            if [ -n "$IEX" ]; then gh issue comment "$IEX" --repo "$GITHUB_REPOSITORY" --body "$IBODY"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$ITITLE" --body "$IBODY"; fi
            echo "无法开 PR，已开 issue" >> "$GITHUB_STEP_SUMMARY"
          fi

  report-failure:
    needs: [check, test-build]
    # Review 6 R6A-4: also when the bump itself (go get / go vet / go test in `check`) failed — that left `updated`
    # unset and the failure went unreported. `branch` is written before those steps, so it marks a started bump.
    if: always() && github.repository == 'astemo6/mihomo-ios' && ((needs.check.outputs.updated == 'true' && needs.test-build.result != 'success') || (needs.check.result == 'failure' && needs.check.outputs.branch != ''))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      BR: ${{ needs.check.outputs.branch }}
      STAGE: ${{ needs.check.result == 'failure' && 'go vet / go test（分支尚未推送，次日会自动重试）' || '测试构建' }}
    steps:
      - name: Open issue
        run: |
          TITLE="内核自动升级失败：mihomo $TAG"
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          BODY=$(printf '自动升级到 mihomo %s 后%s失败，默认分支未改动。\n\n- 分支：`%s`\n- 运行：%s\n\n修复后可在该分支上推送，或删除分支后重新运行 Core auto-update。' "$TAG" "$STAGE" "$BR" "$URL")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
