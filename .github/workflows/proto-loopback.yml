# Protocol loopback tests (fix/nc-proto-loopback): NativeCore's outbound stacks (NCConnector) against a local
# sing-box server — byte-exact echo per protocol, #116 send-completion back-pressure on a real socket, and
# SS / SS2022 UDP round trips. Independent of unit-tests.yml / ui-tests.yml on purpose: this run needs a
# server fleet up before xcodebuild, and it only runs the loopback test class.
#
# Servers: tools/loopback/start-servers.sh (sing-box 1.12.24 pinned, one inbound per protocol on 127.0.0.1,
# plus a python echo/blackhole backend). Constants are mirrored in tools/loopback/sing-box-config.json,
# tools/loopback/README.md and UnitTests/NativeCoreLoopbackTests.swift.
# fix/nc-sudoku-interop: the official SUDOKU-ASCII/sudoku server, built here from the pinned v0.5.2.0 source, on
# :18090–:18094 (configs in tools/loopback/sudoku/) and a plain HTTP origin on :18095.
#
# Not covered, by design (see tools/loopback/README.md): WireGuard client (its NativeCore dialer exists only
# inside the packet tunnel) and Mieru (sing-box has no mieru inbound to test against).
#
# Job `openconnect` (fix/nc-openconnect-dp): the OpenConnect data plane against a REAL ocserv — Alpine + ocserv
# under QEMU (TCG; macOS runners have no Docker / nested virtualisation), tools/loopback/ocserv. The netif is
# PacketTunnel code, so the test class lives in TernE2ETunnelTests (scheme TernE2E).
# Job `masque-ip` (fix/nc-masque-ip): MASQUE CONNECT-IP (RFC 9484) against a REAL CONNECT-IP proxy — the upstream
# connect-ip-go integration proxy (built here with Go for linux/arm64, nothing vendored) in an Alpine VM under QEMU
# (TCG; macOS runners have no Docker / nested virtualisation), tools/loopback/connectip. The netif is PacketTunnel
# code, so the test class lives in TernE2ETunnelTests (scheme TernE2E).
# Job `masque-warp` (feat/nc-masque-warp, OPT-IN: dispatch with jobs containing "masque-warp"; never on push): Cloudflare
# WARP MASQUE against the REAL Cloudflare endpoint. tools/loopback/warp/register.py registers a throwaway free WARP device
# on the runner via Cloudflare's public client API and enrolls a fresh P-256 key (nothing committed, no repo secret);
# E2ETests/NCMASQUEWarpInteropTests then checks HTTPS GET, UDP DNS, 1 MiB download, reconnect, wrong private key and
# wrong public key; the device is deleted at the end.
name: Proto loopback

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run (comma list of loopback, openconnect, masque-ip, masque-warp). Empty = all except the opt-in masque-warp."
        required: false
        default: ""
  push:
    paths:
      - "Shared/NativeCore/**"
      - "UnitTests/NativeCoreLoopbackTests.swift"
      - "tools/loopback/**"
      - ".github/workflows/proto-loopback.yml"
      - "PacketTunnel/NativeCore/NCOpenConnectNetif.swift"
      - "PacketTunnel/NativeCore/NCWireGuard.swift"
      - "E2ETests/NCOpenConnectLoopbackTests.swift"
      - "PacketTunnel/NativeCore/NCMASQUEIPNetif.swift"
      - "E2ETests/NCMASQUEIPLoopbackTests.swift"

permissions:
  contents: read

concurrency:
  group: proto-loopback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loopback:
    if: github.repository == 'astemo6/mihomo-ios' && (!inputs.jobs || contains(inputs.jobs, 'loopback'))
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+)\.app/\1 &/' | grep -v -i beta | sort -V | tail -n1 | cut -d' ' -f2)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Set up Go (masque-go loopback peer; official Sudoku server build)
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build official Sudoku server (SUDOKU-ASCII/sudoku v0.5.2.0, from source)
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v0.5.2.0 https://github.com/SUDOKU-ASCII/sudoku /tmp/sudoku-src
          REV=$(git -C /tmp/sudoku-src rev-parse HEAD)
          echo "sudoku v0.5.2.0 @ $REV"
          test "$REV" = 56ce6f1aeea18aa69b9bc1d57557ed312b59e5f5
          mkdir -p /tmp/nc-loopback/bin
          # go.mod may pin a newer toolchain than setup-go's stable; GOTOOLCHAIN=auto fetches exactly that one.
          (cd /tmp/sudoku-src && GOTOOLCHAIN=auto go build -trimpath -ldflags "-s -w" -o /tmp/nc-loopback/bin/sudoku ./cmd/sudoku-tunnel)
          /tmp/nc-loopback/bin/sudoku -h 2>&1 | head -n 3 || true
          echo "SUDOKU_BIN=/tmp/nc-loopback/bin/sudoku" >> "$GITHUB_ENV"
      - name: Start loopback servers
        run: |
          tools/loopback/start-servers.sh start
          tools/loopback/start-servers.sh status
      - name: Generate project (with test targets)
        run: |
          brew install xcodegen
          xcodegen generate --spec project-uitests.yml
      - name: Pick simulator
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          devs=[(r,x) for r,l in d.items() if 'iOS' in r for x in l]
          devs.sort(key=lambda rx: (0 if 'iOS-18' in rx[0] else 1, rx[0]))
          for want in ['iPhone 16 Pro','iPhone 17 Pro','iPhone 15 Pro','iPhone 16']:
              m=[(r,x) for r,x in devs if x['name']==want]
              if m: print(m[0][1]['udid']); sys.stderr.write('using %s on %s\\n' % (want, m[0][0])); break
          ")
          test -n "$DEV"
          echo "DEV=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV" || true
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild -project Tern.xcodeproj -scheme TernUITests -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEV" -derivedDataPath build/loop \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            build-for-testing 2>&1 | tee build-loop.log | grep -E "error:|\*\* (TEST BUILD|BUILD)" || true
          grep -q "TEST BUILD SUCCEEDED" build-loop.log || { tail -n 150 build-loop.log; exit 1; }
      - name: Run loopback tests
        run: |
          set +e
          xcrun simctl bootstatus "$DEV" -b
          mkdir -p results
          # NC_LOOPBACK=1: the tests must fail loudly here, not skip, if the servers died.
          TEST_RUNNER_JSC_useJIT=false TEST_RUNNER_NC_LOOPBACK=1 \
          xcodebuild -project Tern.xcodeproj -scheme TernUITests -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEV" -derivedDataPath build/loop -resultBundlePath results/loopback.xcresult \
            -only-testing:TernUnitTests/NativeCoreLoopbackTests test-without-building 2>&1 | tee results/loopback.log \
            | grep -E "Test Case .*(failed|passed|skipped)|error:|XCTAssert|Executed"
          RC=${PIPESTATUS[0]}
          [ "$RC" = 0 ] || tail -n 150 results/loopback.log
          {
            echo "### Proto loopback"
            grep -E "Executed [0-9]+ tests?" results/loopback.log | tail -n 1 | sed 's/^/- /'
            echo "- exit $RC"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
      - name: Stop loopback servers
        if: always()
        run: |
          tools/loopback/start-servers.sh stop || true
          cp /tmp/nc-loopback/sing-box.log results/sing-box.log 2>/dev/null || true
          cp /tmp/nc-loopback/masque.log results/masque.log 2>/dev/null || true
          echo "--- sing-box.log (hy2/tuic/quic lines, last 200) ---"
          grep -i -E "hy2|hysteria|tuic|quic|error|warn" /tmp/nc-loopback/sing-box.log | tail -n 200 || true
          # fix/nc-sudoku-interop: the official Sudoku servers (:18090–:18094). The wrong-key cases must show the
          # server's own verdict ("Suspicious connection" + "Fallback"), not a client timeout.
          for f in /tmp/nc-loopback/sudoku-*.log; do
            [ -f "$f" ] || continue
            cp "$f" results/ 2>/dev/null || true
            echo "--- $(basename "$f") (last 40) ---"
            tail -n 40 "$f"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: loopback-results
          path: |
            results/loopback.log
            results/sing-box.log
            results/sudoku-*.log
            results/masque.log
            build-loop.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: loopback-xcresult
          path: results/loopback.xcresult
          if-no-files-found: ignore
          retention-days: 7

  openconnect:
    if: github.repository == 'astemo6/mihomo-ios' && (!inputs.jobs || contains(inputs.jobs, 'openconnect'))
    runs-on: macos-15
    timeout-minutes: 60
    env:
      OC_PORT: "18443"
    steps:
      - uses: actions/checkout@v5
      - name: Cache Alpine cloud image
        uses: actions/cache@v4
        with:
          path: /tmp/nc-ocserv/alpine.qcow2
          key: ocserv-alpine-3.22.4-aarch64-cloudinit
      - name: Boot ocserv VM (background; overlaps the Xcode build)
        run: |
          brew install qemu
          tools/loopback/ocserv/start-ocserv-vm.sh start
      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+)\.app/\1 &/' | grep -v -i beta | sort -V | tail -n1 | cut -d' ' -f2)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Generate project (with test targets)
        run: |
          brew install xcodegen
          xcodegen generate --spec project-uitests.yml
      - name: Pick simulator
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          devs=[(r,x) for r,l in d.items() if 'iOS' in r for x in l]
          devs.sort(key=lambda rx: (0 if 'iOS-18' in rx[0] else 1, rx[0]))
          for want in ['iPhone 16 Pro','iPhone 17 Pro','iPhone 15 Pro','iPhone 16']:
              m=[(r,x) for r,x in devs if x['name']==want]
              if m: print(m[0][1]['udid']); sys.stderr.write('using %s on %s\\n' % (want, m[0][0])); break
          ")
          test -n "$DEV"
          echo "DEV=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV" || true
      - name: Build for testing (TernE2E — compiles the PacketTunnel sources)
        run: |
          set -o pipefail
          xcodebuild -project Tern.xcodeproj -scheme TernE2E -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEV" -derivedDataPath build/oc \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            build-for-testing 2>&1 | tee build-oc.log | grep -E "error:|\*\* (TEST BUILD|BUILD)" || true
          grep -q "TEST BUILD SUCCEEDED" build-oc.log || { tail -n 150 build-oc.log; exit 1; }
      - name: Wait for ocserv
        run: tools/loopback/ocserv/start-ocserv-vm.sh wait 1200
      - name: Run OpenConnect loopback tests
        run: |
          set +e
          xcrun simctl bootstatus "$DEV" -b
          mkdir -p results
          # NC_OC_LOOPBACK=1: the tests fail loudly (never skip) when ocserv is unreachable.
          TEST_RUNNER_JSC_useJIT=false TEST_RUNNER_NC_OC_LOOPBACK=1 TEST_RUNNER_NC_OC_PORT=$OC_PORT \
          xcodebuild -project Tern.xcodeproj -scheme TernE2E -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEV" -derivedDataPath build/oc -resultBundlePath results/openconnect.xcresult \
            -only-testing:TernE2ETunnelTests/NCOpenConnectLoopbackTests test-without-building 2>&1 | tee results/openconnect.log \
            | grep -E "Test Case .*(failed|passed|skipped)|error:|XCTAssert|Executed|oc-loopback|openconnect:"
          RC=${PIPESTATUS[0]}
          [ "$RC" = 0 ] || tail -n 150 results/openconnect.log
          # A run where every test skipped is a failure here.
          if grep -q "skipped" results/openconnect.log && ! grep -q "passed" results/openconnect.log; then RC=1; echo "::error::all OpenConnect loopback tests skipped"; fi
          {
            echo "### OpenConnect loopback (real ocserv)"
            grep -E "Executed [0-9]+ tests?" results/openconnect.log | tail -n 1 | sed 's/^/- /'
            echo "- exit $RC"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
      - name: Stop ocserv VM
        if: always()
        run: |
          tools/loopback/ocserv/start-ocserv-vm.sh stop || true
          mkdir -p results
          cp /tmp/nc-ocserv/console.log results/ocserv-console.log 2>/dev/null || true
          echo "--- ocserv console (ocserv / dnsmasq lines, last 120) ---"
          grep -a -E "ocserv|dnsmasq|OCSETUP" /tmp/nc-ocserv/console.log | tail -n 120 || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: openconnect-loopback-results
          path: |
            results/openconnect.log
            results/ocserv-console.log
            build-oc.log
          if-no-files-found: warn
          retention-days: 14

  masque-ip:
    if: github.repository == 'astemo6/mihomo-ios' && (!inputs.jobs || contains(inputs.jobs, 'masque-ip'))
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MQ_PORT: "18446"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go (builds the upstream CONNECT-IP proxy for the VM)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: Cache Alpine cloud image
        uses: actions/cache@v4
        with:
          path: /tmp/nc-mqip/alpine.qcow2
          key: mqip-alpine-3.22.4-aarch64-cloudinit
      - name: Build proxy + boot CONNECT-IP VM (background; overlaps the Xcode build)
        run: |
          brew install qemu
          tools/loopback/connectip/start-connectip-vm.sh build
          tools/loopback/connectip/start-connectip-vm.sh start
      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+)\.app/\1 &/' | grep -v -i beta | sort -V | tail -n1 | cut -d' ' -f2)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Generate project (with test targets)
        run: |
          brew install xcodegen
          xcodegen generate --spec project-uitests.yml
      - name: Pick simulator
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          devs=[(r,x) for r,l in d.items() if 'iOS' in r for x in l]
          devs.sort(key=lambda rx: (0 if 'iOS-18' in rx[0] else 1, rx[0]))
          for want in ['iPhone 16 Pro','iPhone 17 Pro','iPhone 15 Pro','iPhone 16']:
              m=[(r,x) for r,x in devs if x['name']==want]
              if m: print(m[0][1]['udid']); sys.stderr.write('using %s on %s\\n' % (want, m[0][0])); break
          ")
          test -n "$DEV"
          echo "DEV=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV" || true
      - name: Build for testing (TernE2E — compiles the PacketTunnel sources)
        run: |
          set -o pipefail
          xcodebuild -project Tern.xcodeproj -scheme TernE2E -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEV" -derivedDataPath build/mq \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            build-for-testing 2>&1 | tee build-mq.log | grep -E "error:|\*\* (TEST BUILD|BUILD)" || true
          grep -q "TEST BUILD SUCCEEDED" build-mq.log || { tail -n 150 build-mq.log; exit 1; }
      - name: Wait for CONNECT-IP proxy
        run: tools/loopback/connectip/start-connectip-vm.sh wait 1200
      - name: Run MASQUE CONNECT-IP loopback tests
        run: |
          set +e
          xcrun simctl bootstatus "$DEV" -b
          mkdir -p results
          # NC_MQIP_LOOPBACK=1: the tests fail loudly (never skip) when the proxy is unreachable.
          TEST_RUNNER_JSC_useJIT=false TEST_RUNNER_NC_MQIP_LOOPBACK=1 TEST_RUNNER_NC_MQIP_PORT=$MQ_PORT \
          xcodebuild -project Tern.xcodeproj -scheme TernE2E -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEV" -derivedDataPath build/mq -resultBundlePath results/masque-ip.xcresult \
            -only-testing:TernE2ETunnelTests/NCMASQUEIPLoopbackTests test-without-building 2>&1 | tee results/masque-ip.log \
            | grep -E "Test Case .*(failed|passed|skipped)|error:|XCTAssert|Executed|mqip-loopback|masque-ip:"
          RC=${PIPESTATUS[0]}
          [ "$RC" = 0 ] || tail -n 150 results/masque-ip.log
          if grep -q "skipped" results/masque-ip.log && ! grep -q "passed" results/masque-ip.log; then RC=1; echo "::error::all CONNECT-IP loopback tests skipped"; fi
          {
            echo "### MASQUE CONNECT-IP loopback (real connect-ip-go proxy)"
            grep -E "Executed [0-9]+ tests?" results/masque-ip.log | tail -n 1 | sed 's/^/- /'
            echo "- exit $RC"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
      - name: Stop CONNECT-IP VM
        if: always()
        run: |
          tools/loopback/connectip/start-connectip-vm.sh stop || true
          mkdir -p results
          cp /tmp/nc-mqip/console.log results/mqip-console.log 2>/dev/null || true
          echo "--- VM console (proxy / dnsmasq / setup lines, last 150) ---"
          grep -a -E "proxy|dropping|dnsmasq|MQSETUP|connect-ip|read [0-9]+ bytes" /tmp/nc-mqip/console.log | tail -n 150 || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: masque-ip-loopback-results
          path: |
            results/masque-ip.log
            results/mqip-console.log
            build-mq.log
          if-no-files-found: warn
          retention-days: 14

  masque-warp:
    if: github.repository == 'astemo6/mihomo-ios' && contains(inputs.jobs, 'masque-warp')
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+)\.app/\1 &/' | grep -v -i beta | sort -V | tail -n1 | cut -d' ' -f2)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Generate project (with test targets)
        run: |
          brew install xcodegen
          xcodegen generate --spec project-uitests.yml
      - name: Pick simulator
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          devs=[(r,x) for r,l in d.items() if 'iOS' in r for x in l]
          devs.sort(key=lambda rx: (0 if 'iOS-18' in rx[0] else 1, rx[0]))
          for want in ['iPhone 16 Pro','iPhone 17 Pro','iPhone 15 Pro','iPhone 16']:
              m=[(r,x) for r,x in devs if x['name']==want]
              if m: print(m[0][1]['udid']); sys.stderr.write('using %s on %s\\n' % (want, m[0][0])); break
          ")
          test -n "$DEV"
          echo "DEV=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV" || true
      - name: Build for testing (TernE2E — compiles the PacketTunnel sources)
        run: |
          set -o pipefail
          xcodebuild -project Tern.xcodeproj -scheme TernE2E -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEV" -derivedDataPath build/warp \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            build-for-testing 2>&1 | tee build-warp.log | grep -E "error:|\*\* (TEST BUILD|BUILD)" || true
          grep -q "TEST BUILD SUCCEEDED" build-warp.log || { tail -n 150 build-warp.log; exit 1; }
      - name: Register a throwaway WARP device (MASQUE P-256 key)
        run: |
          for i in 1 2 3; do
            python3 tools/loopback/warp/register.py env "$RUNNER_TEMP/warp.env" && break
            echo "registration attempt $i failed"; rm -f "$RUNNER_TEMP/warp.env"; sleep 10
          done
          test -s "$RUNNER_TEMP/warp.env" || { echo "::error::WARP registration failed 3 times"; exit 1; }
      - name: Run WARP interop tests (real Cloudflare endpoint)
        run: |
          set +e
          xcrun simctl bootstatus "$DEV" -b
          mkdir -p results
          set -a; . "$RUNNER_TEMP/warp.env"; set +a
          TEST_RUNNER_JSC_useJIT=false \
          xcodebuild -project Tern.xcodeproj -scheme TernE2E -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEV" -derivedDataPath build/warp -resultBundlePath results/masque-warp.xcresult \
            -only-testing:TernE2ETunnelTests/NCMASQUEWarpInteropTests test-without-building 2>&1 | tee results/masque-warp.log \
            | grep -E "Test Case .*(failed|passed|skipped)|error:|XCTAssert|Executed|warp-interop|masque"
          RC=${PIPESTATUS[0]}
          [ "$RC" = 0 ] || tail -n 150 results/masque-warp.log
          if grep -q "skipped" results/masque-warp.log && ! grep -q "passed" results/masque-warp.log; then RC=1; echo "::error::all WARP interop tests skipped"; fi
          {
            echo "### MASQUE WARP interop (real Cloudflare endpoint)"
            grep -E "Executed [0-9]+ tests?" results/masque-warp.log | tail -n 1 | sed 's/^/- /'
            grep -E "Test Case .*(passed|failed)" results/masque-warp.log | sed -E 's/.*-\[[^ ]+ ([^]]+)\]. (passed|failed).*/- \1: \2/'
            echo "- exit $RC"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
      - name: Delete the WARP device
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/warp.env" ] && python3 tools/loopback/warp/register.py delete "$RUNNER_TEMP/warp.env" || true
          rm -f "$RUNNER_TEMP/warp.env"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: masque-warp-interop-results
          path: |
            results/masque-warp.log
            build-warp.log
          if-no-files-found: warn
          retention-days: 14
