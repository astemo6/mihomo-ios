name: Mihomo
options:
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

# ──────────────────────────────────────────────────────────────
# 唯一需要修改 Bundle ID / App Group 的地方（Info.plist 与 entitlements 都引用这里）
# ──────────────────────────────────────────────────────────────
settings:
  base:
    APP_BUNDLE_ID: com.astemo6.mihomo
    TUNNEL_BUNDLE_ID: com.astemo6.mihomo.tunnel
    # Widget + Control Center toggle (v0.7); only in the "-widget" IPA variant. Same convention as the tunnel.
    WIDGET_BUNDLE_ID: com.astemo6.mihomo.widget
    APP_GROUP_ID: group.com.astemo6.mihomo
    MARKETING_VERSION: "0.19.25"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # i18n: String Catalog (App/Localizable.xcstrings), source language zh-Hans; the compiler extracts keys.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual
    OTHER_LDFLAGS: ["$(inherited)", "-lresolv"]
    FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/Frameworks"]
  configs:
    Release:
      # Smaller binaries: strip all symbols from the installed products (the Go archive is already built with -s -w).
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      COPY_PHASE_STRIP: YES
      DEPLOYMENT_POSTPROCESSING: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      # v0.14 size pass
      GCC_OPTIMIZATION_LEVEL: s
      ASSETCATALOG_COMPILER_OPTIMIZATION: space
      STRIP_SWIFT_SYMBOLS: YES
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Mihomo:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["**/*.entitlements"]
      - path: Shared
      # feat/jsc-engine: the JavaScriptCore script engine also runs 脚本调试 in the app (and the unit tests).
      - path: PacketTunnel/JSCScriptEngine.swift
      # feat/native-mitm: the native body lane, built into the app only so the unit tests can drive it
      # (UnitTests/NativeBodyStoreTests.swift); the app never registers it.
      - path: PacketTunnel/NativeBodyStore.swift
      # native MitM stage 2 (lane wire): the shared contract + session, in the app only for NativeMitmSessionTests.
      - path: PacketTunnel/NativeMitM/S2Contract.swift
      - path: PacketTunnel/NativeMitM/NativeMitmSession.swift
      - path: PacketTunnel/NativeMitM/S2Integration.swift
      # feat/s2-tls: native MitM TLS front (B7), in the app only for UnitTests/NativeMitmTLSTests.swift; never registered there.
      - path: PacketTunnel/NativeMitM/TLS
      # native MitM stage 2 lane http (B8a): pure-Foundation HTTP/1.1 parser, also in the app for UnitTests/NativeMitmHTTPTests.
      - path: PacketTunnel/NativeMitM/HTTP
      # native MitM stage 2 lane `upstream` (B8b): built into the app only for UnitTests/NativeMitmUpstreamTests.swift.
      - path: PacketTunnel/NativeMitM/Upstream
      # feat/s3-mem: native memory governor (switch nativeMemGovernor, default OFF); in the app for
      # UnitTests/NativeMitmMemoryGovernorTests.swift and because NativeBodyStore / the session / JSC consult it.
      - path: PacketTunnel/NativeMitM/Memory
      # native MitM stage 3a: the native rewrite engine (switch nativeMitmRewrite, default OFF), in the app only for
      # UnitTests/NativeMitmRewriteTests.swift.
      - path: PacketTunnel/NativeMitM/Rewrite
      # native MitM stage 3 lane s3-script: the native script dispatcher (switch nativeMitmScript, default OFF), in the app
      # only for UnitTests/NativeMitmScriptTests.swift.
      - path: PacketTunnel/NativeMitM/Script
      # native MitM stage 3 lane s3-h2: native HTTP/2 (switch nativeMitmH2, default OFF), in the app only for
      # UnitTests/NativeMitmH2Tests.swift + NativeMitmH2LoopbackTests.swift.
      - path: PacketTunnel/NativeMitM/H2
    configFiles:
      Debug: Config/App.signing.xcconfig
      Release: Config/App.signing.xcconfig
    dependencies:
      - target: PacketTunnel
        embed: true
      - target: MihomoWidget
        embed: true
      - framework: Frameworks/Libmihomo.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_NAME: Mihomo
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Mihomo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Night AppIcon-Sky"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        # native MitM stage 2: NativeMitM/ is built (runtime switch default OFF, NativeMitmRuntime); the three
        # stage-1 skeletons stay out until the tls/http/upstream lanes replace them.
        # feat/native-core-eval: PacketFlowBridge (the socketpair to the Go core) is gone with Go; NativeCore reads the
        # packet flow itself (NCDataPlane).
        excludes: ["**/*.entitlements", "NativeMitM/NativeHTTP1Session.swift", "NativeMitM/NativeTLSFront.swift", "NativeMitM/NativeUpstream.swift", "PacketFlowBridge.swift"]
      # The Live Activity attributes are app + widget only (keeps ActivityKit out of the tunnel's memory).
      - path: Shared
        excludes: ["LiveActivityShared.swift", "LiveActivityViews.swift", "TunnelControl.swift"]
      # Bundled MetaCubeX/meta-rules-dat databases, copied into the core home dir before start.
      - path: Geo
        buildPhase: resources
        # v0.14 size pass: ASN.mmdb (8.6 MB, only for IP-ASN rules / $utils.ipasn) is downloaded on demand.
        excludes: ["ASN.mmdb"]
    configFiles:
      Debug: Config/Tunnel.signing.xcconfig
      Release: Config/Tunnel.signing.xcconfig
    # feat/native-core-eval: the tunnel kernel is NativeCore (Swift + vendored lwIP). The extension no longer links
    # Libmihomo (no Go runtime in the NE process); the app still links it for its utility functions and writes the
    # runtime config the tunnel reads (bridge/nativeprep.go).
    dependencies:
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: $(TUNNEL_BUNDLE_ID)
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # Native core (docs/native-core-design.md): vendored lwIP bridge.
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/NativeCore/NCBridge.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/PacketTunnel/NativeCore/lwip
          - $(PROJECT_DIR)/PacketTunnel/NativeCore/lwip/include
          - $(PROJECT_DIR)/PacketTunnel/NativeCore/lwip/port
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited)
        # Files shared with the app pick their Go-free variant with this (see nogo_check in the eval notes).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TERN_NO_GO

  MihomoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
        excludes: ["**/*.entitlements"]
      # NativeCore is app + tunnel only; keep it out of the widget (memory/size).
      - path: Shared
        excludes: ["NativeCore/**"]
      - path: App/Localizable.xcstrings
        buildPhase: resources
    configFiles:
      Debug: Config/Widget.signing.xcconfig
      Release: Config/Widget.signing.xcconfig
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_NAME: MihomoWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGET_BUNDLE_ID)
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/MihomoWidget.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  Mihomo:
    build:
      targets:
        Mihomo: all
        PacketTunnel: all
        MihomoWidget: all
    archive:
      config: Release
